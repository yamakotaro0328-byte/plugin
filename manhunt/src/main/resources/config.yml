# Manhunt configuration
# Language for messages below: "en" or "ja".
# (日本語) 以下のメッセージの言語。"en" または "ja"。
language: en

# head-start-seconds: how long hunters are frozen in place after /manhunt start, giving runners
#   time to scatter before the chase begins. Hunters can still look around, just not move.
# compass-update-interval-ticks: how often each hunter's compass is re-pointed at the nearest
#   (same-world) alive runner.
# (日本語) head-start-seconds: /manhunt start 後、ハンターをその場に足止めする秒数。
#   その間にランナーが散らばる時間を確保する。ハンターは見回すことはできるが移動はできない。
# compass-update-interval-ticks: 各ハンターのコンパスを、最も近い(同じワールドの)生存中の
#   ランナーに向け直す間隔(tick単位)。
head-start-seconds: 60
compass-update-interval-ticks: 20

# items.locator-orb-charges: how many Locator Orbs each hunter gets at game start - each use
#   reveals the nearest alive runner's coordinates, then is consumed.
# items.smoke-bomb-charges: how many Smoke Bombs each runner gets at game start - each use grants
#   a short escape window, then is consumed.
# items.smoke-bomb-duration-seconds: how long the Smoke Bomb's invisibility + speed lasts.
# (日本語) items.locator-orb-charges: ゲーム開始時に各ハンターへ配布される「探知オーブ」の個数。
#   使用すると最も近い生存中のランナーの座標が分かり、1個消費される。
# items.smoke-bomb-charges: ゲーム開始時に各ランナーへ配布される「スモークボム」の個数。
#   使用すると一時的に逃げるチャンスが得られ、1個消費される。
# items.smoke-bomb-duration-seconds: スモークボム使用時の透明化+速度上昇の持続時間(秒)。
items:
  locator-orb-charges: 3
  smoke-bomb-charges: 2
  smoke-bomb-duration-seconds: 8

messages:
