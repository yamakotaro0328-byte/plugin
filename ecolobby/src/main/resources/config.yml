# EcoLobby configuration
# Language for messages below: "en" or "ja".
# (日本語) 以下のメッセージの言語。"en" または "ja"。
language: ja

# The name of the lobby server exactly as configured on your proxy (velocity.toml's [servers]
# table, or BungeeCord's config.yml). /hub sends players here via the "BungeeCord" plugin
# messaging channel, which Velocity also implements for backward compatibility with Bukkit
# plugins - no separate proxy-side plugin is needed.
# (日本語) プロキシ側(velocity.tomlの[servers]、またはBungeeCordのconfig.yml)で設定した
# ロビーサーバーの名前と完全に一致させること。/hub は"BungeeCord"プラグインメッセージ
# チャンネル経由でこのサーバーへ送る(VelocityもBukkitプラグインとの互換性のため
# このチャンネルに対応しているので、プロキシ側に別途プラグインを入れる必要はない)。
lobby-server-name: "lobby"

# Set this to true ONLY on the server that IS the lobby - it enables spawn protection, double
# jump, and the server/links menus below, and makes /hub (and joining) teleport players to the
# lobby spawn instead of sending them elsewhere. Install this same plugin on other backend
# servers with this left false so players there still get a working /hub command back to the
# lobby, without any of the lobby-only features actually running there.
# (日本語) このサーバー自体がロビーである場合のみtrueにする - 以下のスポーン保護・
# 二段ジャンプ・サーバー/リンクメニューが有効になり、/hub(および参加時)はロビーの
# スポーン地点へテレポートするようになる。他のバックエンドサーバーにも同じプラグインを
# 導入する場合はfalseのままにしておけば、ロビー専用機能は動かさずに/hubコマンドだけが
# ロビーへ戻る機能として使える。
is-lobby-server: true

# Individually toggle each lobby-only feature (all require is-lobby-server: true above to do
# anything). clear-inventory-on-join also resets health/hunger/potion effects and gamemode is
# left untouched - block/item protection below is what actually keeps the lobby tidy regardless
# of gamemode.
# (日本語) ロビー専用の各機能を個別にON/OFFできる(いずれも上のis-lobby-server: trueが
# 前提)。clear-inventory-on-joinは体力・満腹度・状態異常もリセットする(ゲームモードは
# 変更しない - ロビーを荒らされないようにするのは下記のprotection設定の役目)。
features:
  protection: true
  double-jump: true
  server-menu: true
  links-menu: true
  void-teleport: true
  clear-inventory-on-join: true

# (日本語) スポーン保護の詳細設定 (features.protection: true の場合のみ有効)
protection:
  disable-pvp: true
  disable-block-break: true
  disable-block-place: true
  disable-item-drop: true
  disable-item-pickup: true
  disable-hunger: true
  disable-fall-damage: true

# velocity: upward+forward speed applied on a double jump.
# cooldown-seconds: minimum time between two double jumps, to stop holding space from repeatedly
#   re-triggering it.
# (日本語) velocity: 二段ジャンプ時に加える上方向・前方向の速度。
# cooldown-seconds: 二段ジャンプ同士の最短間隔(スペース連打での連発を防ぐ)。
double-jump:
  velocity: 0.8
  cooldown-seconds: 1.0

# The compass (server-select menu) and book (links menu) given on join - which hotbar slot each
# goes in, and which item type represents each. Set a feature above to false to skip giving that
# item entirely.
# (日本語) 参加時に配布するコンパス(サーバー選択メニュー)と本(リンクメニュー) -
# それぞれどのホットバースロットに入れるか、どのアイテムにするか。上のfeatureをfalseに
# すればそのアイテム自体を配らない。
items:
  server-menu-slot: 0
  server-menu-material: COMPASS
  links-menu-slot: 8
  links-menu-material: BOOK

# The servers listed in the server-select menu (features.server-menu). "name" must exactly match
# that server's name on the proxy (same rule as lobby-server-name above) - display-name/lore are
# just what's shown in the menu and can be anything.
# (日本語) サーバー選択メニュー(features.server-menu)に表示するサーバー一覧。
# "name"はプロキシ側でのそのサーバー名と完全に一致させること(lobby-server-nameと同じ
# ルール) - display-name/loreはメニュー上の見た目だけなので自由に設定してよい。
servers:
  - name: survival
    display-name: "&aSurvival"
    material: GRASS_BLOCK
    lore:
      - "&7The main survival world"
  - name: creative
    display-name: "&bCreative"
    material: DIAMOND_PICKAXE
    lore:
      - "&7Build anything you want"

# Links shown as clickable chat messages when opening the links menu (features.links-menu).
# (日本語) リンクメニュー(features.links-menu)を開いたときにクリック可能なチャット
# メッセージとして表示するリンク一覧。
links:
  - label: "&5Discord"
    url: "https://discord.gg/example"
  - label: "&9Website"
    url: "https://example.com"

messages:
  en:
    general:
      no-permission: "&cYou don't have permission to do that."
      players-only: "&cOnly players can use this command."
      reloaded: "&aEcoLobby config reloaded."
      usage: "&cUsage: /ecolobby <reload|setspawn>"
    hub:
      teleported: "&aTeleported to the lobby."
      sending: "&aSending you to the lobby..."
      not-configured: "&cNo lobby spawn has been set yet (admin: /ecolobby setspawn)."
    setspawn:
      success: "&aLobby spawn set to your current location."
    menu:
      server-title: "&8Select a server"
      links-title: "&8Links"
      links-header: "&aClick a link below:"
  ja:
    general:
      no-permission: "&cこの操作を行う権限がありません。"
      players-only: "&cこのコマンドはプレイヤーのみ使用できます。"
      reloaded: "&aEcoLobbyの設定を再読み込みしました。"
      usage: "&c使い方: /ecolobby <reload|setspawn>"
    hub:
      teleported: "&aロビーにテレポートしました。"
      sending: "&aロビーへ送っています..."
      not-configured: "&cロビーのスポーン地点が未設定です(管理者は /ecolobby setspawn を実行してください)。"
    setspawn:
      success: "&aロビーのスポーン地点を現在地に設定しました。"
    menu:
      server-title: "&8サーバーを選択"
      links-title: "&8リンク"
      links-header: "&a以下のリンクをクリックしてください:"
