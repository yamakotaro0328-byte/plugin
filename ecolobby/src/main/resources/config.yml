# EcoLobby configuration
# Language for messages below: "en" or "ja".
# (日本語) 以下のメッセージの言語。"en" または "ja"。
language: ja

# The name of the lobby server exactly as configured on your proxy (velocity.toml's [servers]
# table, or BungeeCord's config.yml). /hub sends players here via the "BungeeCord" plugin
# messaging channel, which Velocity also implements for backward compatibility with Bukkit
# plugins - no separate proxy-side plugin is needed.
# (日本語) プロキシ側(velocity.tomlの[servers]、またはBungeeCordのconfig.yml)で設定した
# ロビーサーバーの名前と完全に一致させること。/hub は"BungeeCord"プラグインメッセージ
# チャンネル経由でこのサーバーへ送る(VelocityもBukkitプラグインとの互換性のため
# このチャンネルに対応しているので、プロキシ側に別途プラグインを入れる必要はない)。
lobby-server-name: "lobby"

# This server's OWN name on the proxy - different from lobby-server-name above, which is always
# the name of the HUB regardless of which server this config file is on. Used to tag chat-sync
# messages with their origin server, and to check whether this server belongs to
# inventory-sync-servers below. Set it to match this server's own proxy entry (e.g. "survival",
# "creative", or "lobby" if this IS the lobby).
# (日本語) このサーバー自身の、プロキシ上での名前 - 上のlobby-server-nameは常に
# 「ハブの名前」を指すのに対し、こちらは「この設定ファイルが置かれているサーバー自身の
# 名前」。chat-syncのメッセージに発信元サーバーとしてタグ付けする際と、下の
# inventory-sync-serversに含まれるかどうかの判定に使う。このサーバーのプロキシ上での
# 名前と一致させること(例: "survival", "creative", ロビー自身なら "lobby")。
this-server-name: "lobby"

# Set this to true ONLY on the server that IS the lobby - it enables spawn protection, double
# jump, jump pads, and all the lobby items/menus below, and makes /hub (and joining) teleport
# players to the lobby spawn instead of sending them elsewhere. Install this same plugin on other
# backend servers with this left false so players there still get a working /hub command back to
# the lobby, without any of the lobby-only features actually running there.
# (日本語) このサーバー自体がロビーである場合のみtrueにする - 以下のスポーン保護・
# 二段ジャンプ・ジャンプ台・各種ロビーアイテム/メニューが有効になり、/hub(および参加時)
# はロビーのスポーン地点へテレポートするようになる。他のバックエンドサーバーにも同じ
# プラグインを導入する場合はfalseのままにしておけば、ロビー専用機能は動かさずに
# /hubコマンドだけがロビーへ戻る機能として使える。
is-lobby-server: true

# Individually toggle each lobby-only feature (all require is-lobby-server: true above to do
# anything). clear-inventory-on-join also resets health/hunger/potion effects and gamemode is
# left untouched - block/item protection below is what actually keeps the lobby tidy regardless
# of gamemode. lobby-menu/particle-trail/random-teleport/rules-book/server-info/player-list/
# double-jump-toggle/night-vision-toggle/leave-server/vote-menu control the items reachable from
# the nether-star "lobby menu" item (see items: below for the menu item itself). ender-arrow is
# the shoot-to-teleport bow, rocket-boost is the reusable velocity-boost firework, and
# firework-wand is the pure-spectacle firework launcher (none of the three can affect another
# player). join-title/join-broadcast control the welcome title and the chat message shown to
# everyone when a player joins. chat-sync and inventory-sync are the two exceptions to the
# "requires is-lobby-server: true" rule above - they work on every server running this plugin
# regardless of lobby status, since they're both about linking servers together rather than
# lobby-only gameplay (see chat-sync/inventory-sync-* settings further below).
# (日本語) ロビー専用の各機能を個別にON/OFFできる(いずれも上のis-lobby-server: trueが
# 前提)。clear-inventory-on-joinは体力・満腹度・状態異常もリセットする(ゲームモードは
# 変更しない - ロビーを荒らされないようにするのは下記のprotection設定の役目)。
# lobby-menu以下は、ネザースターの「ロビーメニュー」アイテムから開けるサブ機能の
# 個別ON/OFF(メニューアイテム自体の設定は下のitems:を参照)。ender-arrowは撃つと
# 着弾地点へテレポートする弓、rocket-boostは繰り返し使える推進花火、firework-wandは
# 見た目だけの花火(いずれも他プレイヤーに影響しない)。join-title/join-broadcastは
# 参加時のタイトル表示と全体への参加チャットメッセージ。chat-syncとinventory-syncだけは
# 上記「is-lobby-server: trueが前提」の例外で、ロビーかどうかに関わらずこのプラグインが
# 入っている全サーバーで動作する(サーバー同士を繋ぐ機能であり、ロビー専用のゲーム
# プレイ要素ではないため。詳細は下のchat-sync/inventory-sync-*の設定を参照)。
features:
  protection: true
  double-jump: true
  jump-pads: true
  server-menu: true
  links-menu: true
  void-teleport: true
  clear-inventory-on-join: true
  lobby-menu: true
  visibility-toggle: true
  quick-return: true
  particle-trail: true
  random-teleport: true
  rules-book: true
  server-info: true
  player-list: true
  double-jump-toggle: true
  night-vision-toggle: true
  leave-server: true
  vote-menu: true
  ender-arrow: true
  rocket-boost: true
  firework-wand: true
  join-title: true
  join-broadcast: true
  chat-sync: true
  inventory-sync: true

# (日本語) スポーン保護の詳細設定 (features.protection: true の場合のみ有効)
protection:
  disable-pvp: true
  disable-block-break: true
  disable-block-place: true
  disable-item-drop: true
  disable-item-pickup: true
  disable-hunger: true
  disable-fall-damage: true

# velocity: upward+forward speed applied on a double jump.
# cooldown-seconds: minimum time between two double jumps, to stop holding space from repeatedly
#   re-triggering it.
# (日本語) velocity: 二段ジャンプ時に加える上方向・前方向の速度。
# cooldown-seconds: 二段ジャンプ同士の最短間隔(スペース連打での連発を防ぐ)。
double-jump:
  velocity: 0.8
  cooldown-seconds: 1.0

# Every pressure plate (any wood/stone/weighted variant) launches whoever steps on it, like a
# jump pad. velocity/cooldown-seconds work the same way as double-jump above.
# (日本語) 全ての感圧板(木製・石製・重量式いずれも)を踏むと、ジャンプ台のように
# プレイヤーを打ち上げる。velocity/cooldown-secondsはdouble-jumpと同じ意味。
jump-pad:
  velocity: 0.9
  cooldown-seconds: 0.3

# velocity: forward+upward speed applied when using the rocket-boost item.
# cooldown-seconds: minimum time between two boosts.
# (日本語) velocity: ロケットブーストアイテム使用時に加える前方+上方向の速度。
# cooldown-seconds: ブースト同士の最短間隔。
rocket-boost:
  velocity: 1.4
  cooldown-seconds: 2.0

# A pure spectacle toy with no PvP angle at all - right-clicking launches a firework a couple of
# blocks in front of you with a random color/shape. Nothing about it can affect another player.
# cooldown-seconds: minimum time between two uses.
# (日本語) PvP的な要素が一切ない、純粋な見た目だけのおもちゃ - 右クリックすると
# 自分の少し前方でランダムな色/形の花火が打ち上がる。他プレイヤーに影響することは一切ない。
# cooldown-seconds: 使用同士の最短間隔。
firework-wand:
  cooldown-seconds: 1.0

# The items given on join - which hotbar slot each goes in, and which item type represents each.
# Set the matching feature above to false to skip giving that item entirely. admin-panel is only
# ever given to players holding ecolobby.admin, regardless of this slot/material.
# (日本語) 参加時に配布するアイテム - それぞれどのホットバースロットに入れるか、
# どのアイテムにするか。上のfeatureをfalseにすればそのアイテム自体を配らない。
# admin-panelは、このスロット/アイテム設定に関わらずecolobby.admin権限を持つ
# プレイヤーにのみ配布される。
items:
  server-menu-slot: 0
  server-menu-material: COMPASS
  links-menu-slot: 8
  links-menu-material: BOOK
  lobby-menu-slot: 4
  lobby-menu-material: NETHER_STAR
  visibility-toggle-slot: 1
  visibility-toggle-material: ARROW
  quick-return-slot: 7
  quick-return-material: TOTEM_OF_UNDYING
  admin-panel-slot: 3
  admin-panel-material: BLAZE_ROD
  ender-arrow-slot: 2
  rocket-boost-slot: 6
  firework-wand-slot: 5

# The servers listed in the server-select menu (features.server-menu). "name" must exactly match
# that server's name on the proxy (same rule as lobby-server-name above) - display-name/lore are
# just what's shown in the menu and can be anything.
# (日本語) サーバー選択メニュー(features.server-menu)に表示するサーバー一覧。
# "name"はプロキシ側でのそのサーバー名と完全に一致させること(lobby-server-nameと同じ
# ルール) - display-name/loreはメニュー上の見た目だけなので自由に設定してよい。
servers:
  - name: survival
    display-name: "&aSurvival"
    material: GRASS_BLOCK
    lore:
      - "&7The main survival world"
  - name: creative
    display-name: "&bCreative"
    material: DIAMOND_PICKAXE
    lore:
      - "&7Build anything you want"

# Links shown as clickable chat messages when opening the links menu (features.links-menu).
# (日本語) リンクメニュー(features.links-menu)を開いたときにクリック可能なチャット
# メッセージとして表示するリンク一覧。
links:
  - label: "&5Discord"
    url: "https://discord.gg/example"
  - label: "&9Website"
    url: "https://example.com"

# Separate link list shown by the lobby-menu's vote-menu item (features.vote-menu).
# (日本語) ロビーメニューの投票メニュー項目(features.vote-menu)専用のリンク一覧。
vote-links:
  - label: "&aVote Site 1"
    url: "https://example.com/vote1"
  - label: "&bVote Site 2"
    url: "https://example.com/vote2"

# Particle trail options offered by the lobby-menu's particle-trail item (features.particle-trail).
# "particle" must be a valid org.bukkit.Particle name.
# (日本語) ロビーメニューのパーティクルトレイル項目(features.particle-trail)で
# 選べる候補一覧。"particle"はorg.bukkit.Particleの列挙名と一致させること。
particle-trails:
  - particle: FLAME
    display-name: "&6炎"
    icon: BLAZE_POWDER
  - particle: HEART
    display-name: "&dハート"
    icon: POPPY
  - particle: CLOUD
    display-name: "&f雲"
    icon: WHITE_WOOL
  - particle: PORTAL
    display-name: "&5ポータル"
    icon: OBSIDIAN

# Points the random-teleport item (features.random-teleport) can send a player to, picked at
# random each time. Empty by default - fill in at least one point (matching this server's world
# name) to use this feature.
# (日本語) ランダムワープ項目(features.random-teleport)の送り先候補。毎回この中から
# ランダムに1つ選ばれる。初期状態では空 - このサーバーのワールド名に合わせて
# 最低1つ登録すると使えるようになる。
random-teleport-points: []

# Bridges chat across every server running this plugin, via the proxy's "BungeeCord" plugin
# messaging channel (same mechanism /hub uses) - no database, and no separate proxy-side plugin
# needed. Requires no other setting below; just install this plugin (with chat-sync: true) on
# every server whose chat should be linked, giving each one its own this-server-name above.
# (日本語) このプラグインが入っている全サーバーのチャットを、プロキシの"BungeeCord"
# プラグインメッセージチャンネル経由で繋ぐ(/hubと同じ仕組み) - データベース不要、
# プロキシ側の追加プラグインも不要。下記の設定は不要 - チャットを繋ぎたい全サーバーに
# このプラグインを導入し(chat-sync: trueのまま)、それぞれ上のthis-server-nameを
# 設定するだけでよい。

# Which specific servers share ONE inventory (main inventory + armor + off-hand + ender chest) -
# list this-server-name (see above) for every server that should be in the shared pool. Empty by
# default, so inventory-sync does nothing until configured on at least two servers.
# IMPORTANT: this works WITHOUT a database by writing one YAML file per player under
# inventory-sync-directory - but that only actually syncs anything if that directory is a truly
# SHARED location between the servers involved (e.g. they all run on the same machine and you
# point this at a common path, or a network-mounted/synced folder). If each server only sees its
# own local disk, this feature silently does nothing useful - there is no cross-server storage
# without either a shared filesystem or a database, and this deliberately avoids the latter.
# (日本語) どのサーバー同士でインベントリ(所持品・防具・オフハンド・エンダーチェスト)を
# 共有するか - 共有したい全サーバーの、上のthis-server-nameの値をここに列挙する。
# 初期値は空で、2台以上のサーバーに設定するまでは何もしない。
# 重要: データベースを使わずに実現するため、プレイヤー1人につき1つのYAMLファイルを
# inventory-sync-directory以下に書き出す方式を取っている - これが実際に機能するのは、
# 関係するサーバー同士でそのディレクトリが本当に「共有」されている場合のみ(例:
# 同一マシン上で動かして共通のパスを指定する、またはネットワーク共有/同期されたフォルダを
# 使う)。各サーバーがそれぞれ自分のローカルディスクしか見ていない場合、この機能は
# 何も起きないまま静かに無効なままになる - 共有ファイルシステムかデータベースのどちらかが
# 無ければサーバー間でデータを引き継ぐ方法は無く、本設定は後者を意図的に避けている。
inventory-sync-servers: []
inventory-sync-directory: "inventory-sync"

