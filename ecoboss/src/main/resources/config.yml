# EcoBoss configuration
# Language for messages below: "en" or "ja".
# (日本語) 以下のメッセージの言語。"en" または "ja"。
language: en

# announcement-lead-time-seconds: for WORLD/EVENT bosses, how long the "boss incoming" warning is
#   shown before it actually spawns.
# bossbar-color / bossbar-style: BarColor / BarStyle enum names for every boss's health bar.
# (日本語) announcement-lead-time-seconds: WORLD/EVENTタイプのボスで、出現前に警告を表示してから
#   実際に出現するまでの秒数。
# bossbar-color / bossbar-style: 全ボス共通のボスバーの色・スタイル(BarColor/BarStyleの定数名)。
announcement-lead-time-seconds: 30
bossbar-color: RED
bossbar-style: SEGMENTED_10

# Each entry under "bosses" is one boss definition.
# - entity-type: a vanilla EntityType name (e.g. RAVAGER, WITHER_SKELETON, ZOMBIE, WITHER).
# - type: WORLD (spawns automatically every world-interval-minutes at a /boss setspawn point),
#   DUNGEON (spawns when a player walks into the /boss setregion area), or EVENT (spawns once at
#   event-day-of-week + event-hour, at a /boss setspawn point).
# - health-boost-amplifier / strength-amplifier: applied as permanent Health Boost / Strength
#   potion effects so the boss is tougher and hits harder - no vanilla max-health math needed.
# - cooldown-minutes: how long after death before this boss can spawn again.
# - phases: health-percent thresholds (checked as the fight goes on) that trigger a message, an
#   "enrage" (extra Speed+Strength), and/or summoned adds.
# - loot: weighted reward pool. "guaranteed: true" always drops (once) in addition to the weighted
#   picks for other participants; "broadcast: true" announces that specific drop to the server.
#
# (日本語) bosses以下の各項目が1体のボス定義。
# - entity-type: バニラのEntityType名(RAVAGER、WITHER_SKELETON、ZOMBIE、WITHERなど)。
# - type: WORLD(world-interval-minutesごとに/boss setspawnの地点へ自動出現)、
#   DUNGEON(/boss setregionの範囲にプレイヤーが入ると出現)、
#   EVENT(event-day-of-week + event-hourに一度だけ/boss setspawnの地点へ出現)。
# - health-boost-amplifier / strength-amplifier: 体力増強・与ダメージ増加のポーション効果を
#   常時付与することで強化する(最大体力の直接操作は行わない)。
# - cooldown-minutes: 討伐後、再度出現できるようになるまでの分数。
# - phases: 体力の割合がしきい値を下回るたびにメッセージ・強化(enrage)・増援召喚を行う。
# - loot: 重み付き報酬プール。guaranteed:trueは(他の参加者への抽選とは別に)必ず1回ドロップし、
#   broadcast:trueが付いたドロップはサーバー全体に告知される。
bosses:
  # World boss - a pack-leader Ravager. The weakest of the three, so it can spawn often.
  alpha_ravager:
    display-name: "&2Alpha Ravager"
    entity-type: RAVAGER
    type: WORLD
    world-interval-minutes: 120
    cooldown-minutes: 20
    health-boost-amplifier: 12
    strength-amplifier: 2
    phases:
      - health-percent: 50
        message: "&2{boss} bellows in rage!"
        enrage: true
      - health-percent: 20
        message: "&2{boss} calls its pack!"
        summon-type: WOLF
        summon-count: 3
    loot:
      - material: LEATHER
        amount: 8
        name: "&fTough Hide"
        weight: 40
      - material: IRON_INGOT
        amount: 6
        name: "&fIron Ingot"
        weight: 30
      - material: EMERALD
        amount: 4
        name: "&aEmerald"
        weight: 20
        guaranteed: true
      - material: SADDLE
        amount: 1
        name: "&6Alpha Saddle"
        weight: 5
        broadcast: true

  # Dungeon boss - a Hoglin warlord guarding its territory. Tougher than the world boss.
  hollow_hoglin:
    display-name: "&cHollow Hoglin"
    entity-type: HOGLIN
    type: DUNGEON
    cooldown-minutes: 45
    health-boost-amplifier: 16
    strength-amplifier: 3
    phases:
      - health-percent: 60
        message: "&c{boss} snorts and charges!"
        enrage: true
      - health-percent: 25
        message: "&c{boss} summons hoglin thugs!"
        summon-type: HOGLIN
        summon-count: 2
    loot:
      - material: PORKCHOP
        amount: 10
        name: "&fRaw Pork"
        weight: 40
      - material: GOLD_NUGGET
        amount: 12
        name: "&eGold Nuggets"
        weight: 30
      - material: CRIMSON_FUNGUS
        amount: 4
        name: "&5Crimson Fungus"
        weight: 15
      - material: NETHERITE_SCRAP
        amount: 1
        name: "&8Netherite Scrap"
        weight: 5
        guaranteed: true
        broadcast: true

  # Event boss - what a Hoglin becomes after too long in the overworld. The strongest of the three,
  # once a week only.
  zoglin_warlord:
    display-name: "&8Zoglin Warlord"
    entity-type: ZOGLIN
    type: EVENT
    event-day-of-week: SUNDAY
    event-hour: 21
    cooldown-minutes: 10080
    health-boost-amplifier: 24
    strength-amplifier: 5
    phases:
      - health-percent: 50
        message: "&8{boss} lets out an undead roar!"
        enrage: true
      - health-percent: 20
        message: "&8{boss} summons the fallen!"
        summon-type: ZOMBIE
        summon-count: 5
    loot:
      - material: ROTTEN_FLESH
        amount: 16
        name: "&8Rotten Flesh"
        weight: 40
      - material: DIAMOND_BLOCK
        amount: 2
        name: "&bDiamond Block"
        weight: 20
      - material: NETHERITE_INGOT
        amount: 1
        name: "&6Netherite Ingot"
        weight: 10
        guaranteed: true
        broadcast: true
      - material: NETHER_STAR
        amount: 1
        name: "&d&lNether Star"
        weight: 2
        broadcast: true

