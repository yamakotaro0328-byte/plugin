# EcoRail configuration
# Language for messages below: "en" or "ja".
# (日本語) 以下のメッセージの言語。"en" または "ja"。
language: en

# How fares are charged. Vault is optional - if it's missing (or a player has no balance),
# they can still ride by holding a matching physical ticket item instead.
# (日本語) 運賃の扱い。Vaultが無い(または残高不足の)場合でも、対応する切符アイテムを
# 持っていれば乗車できる。
economy:
  enabled: true

# Governs how managed minecarts (ones spawned from a boarding sign) keep moving even when no
# player has their chunk loaded. Every tick-interval-ticks, EcoRail force-loads a
# (2*chunk-load-radius+1)-chunk square around each managed cart's last known position - large
# enough for vanilla rail physics to keep simulating it, small enough not to force-load the
# whole line at once. Carts release their forced chunks once they arrive at their destination, or
# after idle-release-seconds with no movement (a safety net against a derailed/stuck cart pinning
# chunks loaded forever).
# (日本語) 「切符で乗った」トロッコを、誰もチャンクを読み込んでいなくても走らせ続けるための設定。
# tick-interval-ticks 毎に、各トロッコの直近位置を中心とした
# (2*chunk-load-radius+1)四方のチャンクを強制ロードする。目的地に到着するか、
# idle-release-seconds 秒動きが無ければ強制ロードを解除する(脱線などで永久に
# チャンクを固定してしまう事故を防ぐための安全策)。
physics:
  tick-interval-ticks: 4
  chunk-load-radius: 2
  stop-radius: 1.5
  launch-speed: 0.4
  idle-release-seconds: 300

# Per-player defaults for /ecorail settings, used until a player changes them there themselves.
# anti-reverse corrects a cart back to its launch direction if it starts rolling backward (a
# shove, another cart, or momentum at a dead end). player-collision is whether a player's own
# carts push other players standing in their path, same as vanilla.
# (日本語) /ecorail settings のプレイヤーごとの初期値(本人が変更するまで使われる)。
# anti-reverse は、何らかの理由(衝突・惰性など)でトロッコが逆走し始めた際に
# 出発時の方向へ補正する機能。player-collision は自分のトロッコが他プレイヤーを
# 押し出すかどうか(バニラの挙動)。
settings:
  default-anti-reverse: true
  default-player-collision: true

