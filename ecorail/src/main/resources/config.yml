# EcoRail configuration
# Language for messages below: "en" or "ja".
# (日本語) 以下のメッセージの言語。"en" または "ja"。
language: ja

# EcoRail has no route data of its own - the rails you build ARE the route. Every minecart on the
# server is managed automatically the moment it exists: EcoRail keeps it running forever, never
# lets it be stopped or reversed by anything, and passes it straight through players and mobs.
# It pauses only at a stop point you create (see /ecorail stop create), then relaunches in the
# same direction once the dwell time is up. Only whoever placed a rail or minecart (or a player
# with ecorail.admin) can break it - see /ecorail's permission node.
#
# chunk-load-radius-blocks: how many blocks (in each direction) around a managed cart get
#   force-loaded so it keeps simulating with nobody nearby. Keep this small - it only needs to
#   cover what's immediately around the cart, not the whole line.
# stop-radius: how close (in blocks) a cart needs to get to a stop point to trigger it.
# launch-speed: the velocity a cart is given when relaunched (after dwelling, or whenever
#   something has stopped or reversed it and EcoRail is forcing it back to speed).
#
# (日本語) EcoRail自体は経路データを持たない - 自分で敷いたレールがそのまま経路になる。
# サーバー上の全てのトロッコは存在した瞬間に自動的に管理対象になり、何があっても
# 止められたり逆走させられたりせず、プレイヤーやMobを貫通する。止まるのは
# /ecorail stop create で作った停止地点だけで、停車時間が来たら同じ方向へ再発進する。
# レール・トロッコを壊せるのは設置した本人(または ecorail.admin 権限者)だけ。
#
# chunk-load-radius-blocks: 管理対象のトロッコの周囲、何ブロック四方を強制ロードするか。
#   小さめにしておくこと - トロッコの直近だけで十分で、路線全体を強制ロードする必要はない。
# stop-radius: 停止地点にどれだけ近づいたら反応するか(ブロック数)。
# launch-speed: 再発進(停止地点からの発車、または何かに止められた際の強制復帰)の速度。
physics:
  tick-interval-ticks: 4
  chunk-load-radius-blocks: 8
  stop-radius: 1.5
  launch-speed: 0.4

messages:
  en:
    general:
      no-permission: "&cYou don't have permission to do that."
      player-only: "&cThis command can only be used by a player."
    stop:
      usage: "&cUsage: /ecorail stop <create|remove|list>"
      create-usage: "&cUsage: /ecorail stop create <seconds>"
      invalid-seconds: "&cSeconds must be a whole number greater than 0."
      created: "&aCreated a stop point here ({seconds}s dwell)."
      removed: "&aRemoved the nearest stop point."
      not-found-nearby: "&cNo stop point found nearby."
      list-header: "&7--- Stop points ({count}) ---"
      list-empty: "&7No stop points registered."
      list-entry: "&f({world} {x}, {y}, {z}) &7- {seconds}s"
    ecorail:
      usage: "&cUsage: /ecorail <stop <create|remove|list>|reload>"
      reloaded: "&aReloaded config.yml."
  ja:
    general:
      no-permission: "&cこの操作を行う権限がありません。"
      player-only: "&cこのコマンドはプレイヤーのみ使用できます。"
    stop:
      usage: "&c使い方: /ecorail stop <create|remove|list>"
      create-usage: "&c使い方: /ecorail stop create <秒数>"
      invalid-seconds: "&c秒数は1以上の整数で指定してください。"
      created: "&aこの場所に停止地点を作成しました({seconds}秒停車)。"
      removed: "&a最も近い停止地点を削除しました。"
      not-found-nearby: "&c近くに停止地点が見つかりません。"
      list-header: "&7--- 停止地点一覧 ({count}) ---"
      list-empty: "&7登録されている停止地点はありません。"
      list-entry: "&f({world} {x}, {y}, {z}) &7- {seconds}秒"
    ecorail:
      usage: "&c使い方: /ecorail <stop <create|remove|list>|reload>"
      reloaded: "&aconfig.ymlを再読み込みしました。"
