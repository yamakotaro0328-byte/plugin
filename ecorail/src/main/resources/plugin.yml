name: EcoRail
version: '${project.version}'
main: com.yamakotaro.ecorail.EcoRailPlugin
api-version: '26.2'
author: yamakotaro0328
description: Every minecart runs forever on your own rails, passing straight through players/mobs and pausing only at marked stop points - chunks are force-loaded around each one so it keeps moving with nobody nearby, and only its placer (or an admin) can break it or its rails.

commands:
  ecorail:
    description: Manage EcoRail stop points, or reload config.yml
    usage: /ecorail <stop <create|remove|list>|reload>
    aliases: [rail]

permissions:
  ecorail.admin:
    description: Can create/remove stop points, reload config.yml, and break any rail or minecart regardless of who placed it
    default: op
