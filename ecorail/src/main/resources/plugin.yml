name: EcoRail
version: '${project.version}'
main: com.yamakotaro.ecorail.EcoRailPlugin
api-version: '26.2'
author: yamakotaro0328
description: Keeps admin-marked minecarts running forever on your own rails, pausing at marked stop points, with chunks force-loaded around them so they keep moving with nobody nearby.

commands:
  ecorail:
    description: Manage EcoRail stop points and managed minecarts, or reload config.yml
    usage: /ecorail <stop <create|remove|list>|cart <mark|unmark>|reload>
    aliases: [rail]

permissions:
  ecorail.admin:
    description: Can create/remove stop points, mark/unmark minecarts, and reload config.yml
    default: op
