# EcoEvents configuration
# Language for messages below: "en" or "ja".
# (日本語) 以下のメッセージの言語。"en" または "ja"。
language: ja

# schedule.min/max-interval-minutes: after each event (and at startup), the next one fires after a
#   random delay in this range. Nothing fires while no one is online.
# (日本語) schedule.min/max-interval-minutes: イベント発生後(および起動時)、この範囲内の
#   ランダムな時間が経過すると次のイベントが発生する。プレイヤーが誰もいない間は発生しない。
schedule:
  min-interval-minutes: 8
  max-interval-minutes: 20

# Each entry under "events" is one environmental event. Many share the same "mechanic" (the
# underlying behavior) with different names/radius/duration/magnitude/effects - e.g.
# "meteor_strike" and "rogue_comet" are both METEOR_STRIKE, just tuned differently.
# - mechanic: one of METEOR_STRIKE, METEOR_SHOWER, THUNDERSTORM, LIGHTNING_BARRAGE, BLIZZARD,
#   TYPHOON, SANDSTORM, EARTHQUAKE, PLAGUE, BLESSING, SKYFALL_LOOT, VOID_RIFT, WILDFIRE, FROST_WAVE,
#   AURORA, ECLIPSE.
# - weight: relative chance of being picked when an event fires.
# - radius / duration-seconds / magnitude: meaning depends on the mechanic (area of effect, how
#   long weather/potion effects last, and general intensity - e.g. meteor count or strike count).
# - effects: potion effects applied to every online player - used by PLAGUE, BLESSING, BLIZZARD,
#   SANDSTORM, FROST_WAVE.
# - loot: weighted item pool that rains down - used only by SKYFALL_LOOT.
#
# (日本語) events以下の各項目が1つの環境イベント。多くは同じ"mechanic"(基礎となる挙動)を
# 名前・範囲・持続時間・強さ・効果を変えて使い回している(例: meteor_strikeとrogue_cometは
# どちらもMETEOR_STRIKEだが強さが違う)。
# - mechanic: METEOR_STRIKE、METEOR_SHOWER、THUNDERSTORM、LIGHTNING_BARRAGE、BLIZZARD、
#   SANDSTORM、EARTHQUAKE、PLAGUE、BLESSING、SKYFALL_LOOT、VOID_RIFT、WILDFIRE、FROST_WAVE、
#   AURORA、ECLIPSEのいずれか。
# - weight: イベント発生時に選ばれる相対的な重み。
# - radius / duration-seconds / magnitude: mechanicにより意味が変わる(効果範囲、天候・ポーション
#   効果の持続時間、全般的な強さ - 隕石の数や落雷の回数など)。
# - effects: 全オンラインプレイヤーに付与するポーション効果 - PLAGUE、BLESSING、BLIZZARD、
#   SANDSTORM、FROST_WAVEで使用。
# - loot: 降ってくる重み付きアイテムプール - SKYFALL_LOOTでのみ使用。
events:
  meteor_strike:
    display-name: "&cMeteor Strike"
    mechanic: METEOR_STRIKE
    weight: 12
    radius: 6
    duration-seconds: 4
    magnitude: 1.0

