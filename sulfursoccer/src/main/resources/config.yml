# SulfurSoccer configuration
# Language for messages below: "en" or "ja".
# (日本語) 以下のメッセージの言語。"en" または "ja"。
language: en

# match.goals-to-win: first team to reach this score wins immediately.
# match.time-limit-minutes: match ends (higher score wins, or a draw) after this many minutes
#   even if nobody has reached goals-to-win yet. 0 disables the time limit.
# match.tick-interval-ticks: how often (in ticks) the ball's position is checked for a goal.
# (日本語) match.goals-to-win: 先にこの得点に達したチームが即座に勝利する。
# match.time-limit-minutes: goals-to-winに達していなくても、この分数が経過したら
#   試合終了(得点が高い方の勝ち、同点なら引き分け)。0で時間制限なし。
# match.tick-interval-ticks: ボールの位置(ゴール判定)を何tickごとに確認するか。
match:
  goals-to-win: 5
  time-limit-minutes: 10
  tick-interval-ticks: 10

messages:
