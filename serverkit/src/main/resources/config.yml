# en / ja, same convention as EcoTP / EcoTP-QuickActions.
language: en

modules:
  staff: true
  referral: true
  dragonarena: true
  claims: true

staffchat:
  # {player} / {message}
  format: "&8[&bSTAFF&8]&7 {player}&8: &f{message}"

referral:
  # A claim (/referral claim <inviter>) is only accepted if the claimant's very first join
  # was this recently - stops two long-established accounts from declaring each other
  # "invited" after the fact just to farm the reward.
  new-player-window-minutes: 60
  # Vault reward paid to the inviter once, per (inviter, claimant) pair, on confirmation.
  reward-amount: 500.0

dragonarena:
  # Seconds a player must wait after finishing a fight before starting another one.
  cooldown-seconds: 300
  # How many arena worlds can exist at the same time (each fight uses its own).
  max-instances: 3
  # Max players in one party/fight.
  team-size-max: 4
  # Seconds a party invite / fight party invite stays valid.
  invite-timeout-seconds: 60

claims:
  enabled: true
  # Claim blocks every player starts with (a claim's area in blocks must fit within their balance).
  starting-blocks: 100
  # Claim blocks earned automatically per interval below, for every online player.
  accrual-amount: 100
  accrual-interval-minutes: 60
  # 0 = no cap on how many claim blocks a player can bank up.
  max-blocks: 0
  # Which actions are protected inside a claim for non-owners/non-trusted players.
  protect:
    blocks: true
    containers: true
    pvp: true
    mob-spawning: true
  # If Towny and/or Lands is installed (detected automatically, no extra setup needed),
  # refuse to create a ServerKit claim that overlaps their territory.
  respect-towny: true
  respect-lands: true

