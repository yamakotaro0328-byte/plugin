# en / ja, same convention as EcoTP / EcoTP-QuickActions.
language: en

modules:
  staff: true
  referral: true
  dragonarena: true

staffchat:
  # {player} / {message}
  format: "&8[&bSTAFF&8]&7 {player}&8: &f{message}"

referral:
  # A claim (/referral claim <inviter>) is only accepted if the claimant's very first join
  # was this recently - stops two long-established accounts from declaring each other
  # "invited" after the fact just to farm the reward.
  new-player-window-minutes: 60
  # Vault reward paid to the inviter once, per (inviter, claimant) pair, on confirmation.
  reward-amount: 500.0

dragonarena:
  # Seconds a player must wait after finishing a fight before starting another one.
  cooldown-seconds: 300
  # How many arena worlds can exist at the same time (each fight uses its own).
  max-instances: 3
  # Max players in one party/fight.
  team-size-max: 4
  # Seconds a party invite / fight party invite stays valid.
  invite-timeout-seconds: 60

messages:
  en:
    general:
      players-only: "&cThis command can only be used by players."
      no-permission: "&cYou don't have permission to do that."
      player-not-found: "&cPlayer '{player}' not found."
    staff:
      vanish-on: "&7You are now vanished."
      vanish-off: "&7You are now visible."
      freeze-usage: "&cUsage: /freeze <player>"
      freeze-on: "&7{player} is now frozen."
      freeze-off: "&7{player} is no longer frozen."
      you-were-frozen: "&cA staff member froze you in place."
      you-were-unfrozen: "&7You have been unfrozen."
      frozen-blocked: "&cYou can't do that while frozen."
      staffchat-mode-on: "&bStaff chat mode ON &7(everything you type goes to staff chat; run /staffchat again to turn it off)"
      staffchat-mode-off: "&7Staff chat mode off."
    referral:
      usage: "&cUsage: /referral <claim|confirm> <player>"
      cannot-target-self: "&cYou can't refer yourself."
      target-never-played: "&cThat player has never joined this server."
      already-claimed: "&cYou've already used your one referral claim."
      not-new-enough: "&cThis only works within {minutes} minutes of your very first join."
      claim-sent: "&7Claim sent - if {player} confirms it with /referral confirm {you}, they'll get a reward."
      claim-received: "&7{player} claims you invited them to the server. /referral confirm {player} to confirm and get rewarded."
      no-pending-claim: "&cNo pending claim from {player} naming you."
      already-rewarded: "&cThat pair has already been rewarded."
      no-economy: "&cNo economy plugin is available, so no reward could be paid out."
      confirmed-inviter: "&aConfirmed! You received {amount} for inviting {player}."
      confirmed-claimant-notify: "&7{player} confirmed your claim."
    dragonarena:
      usage: "&cUsage: /dragonfight <start|leave|party invite <player>|party accept|party leave>"
      on-cooldown: "&cYou need to wait {seconds}s before starting another dragon fight."
      max-instances: "&cAll dragon arenas are in use right now, try again shortly."
      already-in-fight: "&cYou're already in a dragon fight."
      not-in-fight: "&cYou're not in a dragon fight."
      party-invited: "&7Invited {player} to your dragon fight party."
      party-invite-received: "&7{player} invited you to a dragon fight party. /dragonfight party accept to join."
      party-no-pending-invite: "&cYou have no pending party invite."
      party-joined: "&7You joined {player}'s party."
      party-not-leader: "&cOnly the party leader can do that. Use /dragonfight party leave first if you want to lead your own."
      party-target-is-self: "&cYou can't invite yourself."
      party-target-in-party: "&cThat player is already in a party."
      party-not-in-party: "&cYou're not in a party."
      party-left: "&7You left your party."
      party-full: "&cThat party is full."
      starting: "&aOpening a dragon arena, teleporting your party..."
      command-blocked: "&cCommands are disabled while fighting the dragon."
      victory: "&a&lYou defeated the Ender Dragon!"
      defeat: "&c&lYour dragon fight ended - you died."
      left-fight: "&7You left the dragon fight and were returned to your last location."
      world-error: "&cCouldn't create the dragon arena, please try again."
