name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --no-transfer-progress

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: ecotp-plugin
          path: target/ecotp-plugin-*.jar
          if-no-files-found: error

  build-addon:
    # Independent Maven project (its own pom.xml), built in its own job so a build failure
    # here never blocks or reflects on the main EcoTP plugin's build above.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: addon-quickactions/pom.xml

      - name: Build with Maven
        working-directory: addon-quickactions
        run: mvn -B package --no-transfer-progress

      - name: Upload add-on jar
        uses: actions/upload-artifact@v4
        with:
          name: ecotp-quickactions
          path: addon-quickactions/target/ecotp-quickactions-*.jar
          if-no-files-found: error

  build-serverkit:
    # Independent Maven project (its own pom.xml), unrelated to EcoTP - built in its own job
    # so a build failure here never blocks or reflects on EcoTP or EcoTP-QuickActions.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: serverkit/pom.xml

      - name: Build with Maven
        working-directory: serverkit
        run: mvn -B package --no-transfer-progress

      - name: Upload ServerKit jar
        uses: actions/upload-artifact@v4
        with:
          name: serverkit
          path: serverkit/target/serverkit-*.jar
          if-no-files-found: error

  build-quickshop-nova-compat:
    # Independent Maven project (its own pom.xml), unrelated to EcoTP - built in its own job
    # so a build failure here never blocks or reflects on any of the other plugins.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: addon-quickshop-nova/pom.xml

      - name: Build with Maven
        working-directory: addon-quickshop-nova
        run: mvn -B package --no-transfer-progress

      - name: Upload QuickShop-Nova-Compat jar
        uses: actions/upload-artifact@v4
        with:
          name: quickshop-nova-compat
          path: addon-quickshop-nova/target/quickshop-nova-compat-*.jar
          if-no-files-found: error

  build-ecojobs:
    # Independent Maven project (its own pom.xml), unrelated to EcoTP - built in its own job
    # so a build failure here never blocks or reflects on any of the other plugins.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ecojobs/pom.xml

      - name: Build with Maven
        working-directory: ecojobs
        run: mvn -B package --no-transfer-progress

      - name: Upload EcoJobs jar
        uses: actions/upload-artifact@v4
        with:
          name: ecojobs
          path: ecojobs/target/ecojobs-*.jar
          if-no-files-found: error

  build-ecoban:
    # Independent Maven project (its own pom.xml), unrelated to EcoTP - built in its own job
    # so a build failure here never blocks or reflects on any of the other plugins. ecoban depends
    # on ecoban-core (a sibling module, not a server-provided API), so ecoban-core is installed to
    # the local Maven repository first.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: |
            ecoban-core/pom.xml
            ecoban/pom.xml

      - name: Install ecoban-core
        working-directory: ecoban-core
        run: mvn -B install -DskipTests --no-transfer-progress

      - name: Build with Maven
        working-directory: ecoban
        run: mvn -B package --no-transfer-progress

      - name: Upload EcoBan jar
        uses: actions/upload-artifact@v4
        with:
          name: ecoban
          path: ecoban/target/ecoban-*.jar
          if-no-files-found: error

  build-ecoban-velocity:
    # Independent Maven project (its own pom.xml), unrelated to EcoTP - built in its own job
    # so a build failure here never blocks or reflects on any of the other plugins.
    # ecoban-velocity depends on ecoban-core (a sibling module, not a proxy-provided API), so
    # ecoban-core is installed to the local Maven repository first.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: |
            ecoban-core/pom.xml
            ecoban-velocity/pom.xml

      - name: Install ecoban-core
        working-directory: ecoban-core
        run: mvn -B install -DskipTests --no-transfer-progress

      - name: Build with Maven
        working-directory: ecoban-velocity
        run: mvn -B package --no-transfer-progress

      - name: Upload EcoBan-Velocity jar
        uses: actions/upload-artifact@v4
        with:
          name: ecoban-velocity
          path: ecoban-velocity/target/ecoban-velocity-*.jar
          if-no-files-found: error

  build-ecorail:
    # Independent Maven project (its own pom.xml), unrelated to EcoTP - built in its own job
    # so a build failure here never blocks or reflects on any of the other plugins.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ecorail/pom.xml

      - name: Build with Maven
        working-directory: ecorail
        run: mvn -B package --no-transfer-progress

      - name: Upload EcoRail jar
        uses: actions/upload-artifact@v4
        with:
          name: ecorail
          path: ecorail/target/ecorail-*.jar
          if-no-files-found: error
