# EcoJobs configuration
# Language for messages below: "en" or "ja".
# (日本語) 以下のメッセージの言語。"en" または "ja"。
language: ja

# How many jobs a single player can be in at the same time.
# (日本語) 1人のプレイヤーが同時に加入できるジョブ数。
max-concurrent-jobs: 3

# Where job progress is saved. "yaml" (default) needs no setup. "mysql" shares progress across
# multiple servers pointed at the same database - fill in storage.mysql below.
# (日本語) ジョブの進行状況の保存先。"yaml"(デフォルト)は設定不要。"mysql"にすると、
# 同じデータベースを指す複数サーバー間で進行状況を共有できる(下のstorage.mysqlを設定)。
storage:
  type: yaml
  mysql:
    host: localhost
    port: 3306
    database: ecojobs
    username: root
    password: ""
    table-prefix: "ecojobs_"

leveling:
  # xp required to go from level N to N+1 = base-xp-to-level * N ^ growth-exponent
  # (日本語) レベルNからN+1に必要な経験値 = base-xp-to-level * N ^ growth-exponent
  base-xp-to-level: 50
  growth-exponent: 1.35
  # Money earned per action is multiplied by (1 + level * pay-bonus-per-level), so a level 40
  # miner earns 20% more per action than a level 0 miner at the default 0.005 (0.5%/level).
  # (日本語) 1回の行動で得るお金は (1 + レベル * pay-bonus-per-level) 倍される。デフォルトの
  # 0.005 (レベルごとに0.5%) だとレベル40で+20%になる。
  pay-bonus-per-level: 0.005
  max-level: 100
  # Once a job hits max-level, /jobs prestige <job> resets it to level 1 (and 0 xp) in exchange
  # for one permanent stack of this bonus, which stacks additively with pay-bonus-per-level - so
  # at the defaults, a prestige-3 level-40 miner earns (1 + 40*0.005 + 3*0.02) = +26% per action.
  # (日本語) ジョブが最大レベルに達すると、/jobs prestige <ジョブ名> でレベル1(経験値0)に
  # 戻す代わりに、この永続ボーナスが1つ蓄積される(pay-bonus-per-levelと加算される)。
  prestige-bonus-per-prestige: 0.02
  # Every job pays a one-time bonus (broadcast server-wide) whenever it reaches one of these
  # levels. Re-triggers on each future prestige cycle's relevel, since prestige exists to be
  # replayed. Set milestone-bonus-money to 0 to keep the fanfare without the payout.
  # (日本語) どのジョブも、これらのレベルに到達するたびに一度きりのボーナス(サーバー全体に
  # 告知)がもらえる。プレステージ後に同じレベルを再び通過した際も再発生する(プレステージは
  # 繰り返し遊ぶための仕組みのため)。演出だけ残して支払いを止めたい場合はmilestone-bonus-moneyを
  # 0にする。
  milestone-levels: [10, 25, 50, 75, 100]
  milestone-bonus-money: 100

# The "explorer" job doesn't have a block/entity/item action list like the others below - it
# pays out every time a player reaches a new farthest distance (in blocks, ignoring height) from
# their world's spawn point.
# (日本語) 「探検家」ジョブだけは下のjobsのactionsを使わず、ワールドスポーンから
# (高さを無視した)最も遠い距離を更新するたびに支払われる。
explorer:
  distance-per-milestone: 250
  money-per-milestone: 100
  xp-per-milestone: 60

# Every other job: a map of action-type -> (material/entity name, or "default") -> {money, xp}.
# Material/entity names are the same names used in Java's Material/EntityType enums (as shown in
# the Bukkit/Paper API docs), case-insensitive. Add or remove entries freely; anything not listed
# for a job (and with no "default" entry) simply doesn't pay out for that job.
# (日本語) 他のジョブはすべて action-type -> (素材名/エンティティ名、または"default") ->
# {money, xp} の対応表になっている。名前はJavaのMaterial/EntityType列挙型と同じ表記
# (大文字小文字は区別しない)。自由に追加・削除でき、載っていない("default"も無い)ものは
# そのジョブでは何ももらえないだけ。
jobs:
  miner:
    actions:
      break-block:
        COAL_ORE: { money: 4, xp: 3 }
        DEEPSLATE_COAL_ORE: { money: 4, xp: 3 }
        COPPER_ORE: { money: 4, xp: 3 }
        DEEPSLATE_COPPER_ORE: { money: 4, xp: 3 }
        IRON_ORE: { money: 7, xp: 5 }
        DEEPSLATE_IRON_ORE: { money: 7, xp: 5 }
        GOLD_ORE: { money: 10, xp: 6 }
        DEEPSLATE_GOLD_ORE: { money: 10, xp: 6 }
        NETHER_GOLD_ORE: { money: 8, xp: 5 }
        REDSTONE_ORE: { money: 6, xp: 4 }
        DEEPSLATE_REDSTONE_ORE: { money: 6, xp: 4 }
        LAPIS_ORE: { money: 6, xp: 4 }
        DEEPSLATE_LAPIS_ORE: { money: 6, xp: 4 }
        DIAMOND_ORE: { money: 40, xp: 20 }
        DEEPSLATE_DIAMOND_ORE: { money: 40, xp: 20 }
        EMERALD_ORE: { money: 45, xp: 22 }
        DEEPSLATE_EMERALD_ORE: { money: 45, xp: 22 }
        NETHER_QUARTZ_ORE: { money: 5, xp: 3 }
        ANCIENT_DEBRIS: { money: 120, xp: 60 }

  digger:
    actions:
      break-block:
        DIRT: { money: 0.2, xp: 0.2 }
        GRASS_BLOCK: { money: 0.2, xp: 0.2 }
        SAND: { money: 0.2, xp: 0.2 }
        RED_SAND: { money: 0.2, xp: 0.2 }
        GRAVEL: { money: 0.3, xp: 0.3 }
        CLAY: { money: 0.5, xp: 0.4 }
        STONE: { money: 0.3, xp: 0.3 }
        COBBLESTONE: { money: 0.3, xp: 0.3 }
        DEEPSLATE: { money: 0.3, xp: 0.3 }
        COBBLED_DEEPSLATE: { money: 0.3, xp: 0.3 }
        NETHERRACK: { money: 0.2, xp: 0.2 }
        SOUL_SAND: { money: 0.4, xp: 0.3 }
        SOUL_SOIL: { money: 0.4, xp: 0.3 }
        END_STONE: { money: 0.4, xp: 0.3 }

  woodcutter:
    actions:
      break-block:
        OAK_LOG: { money: 2, xp: 1.5 }
        SPRUCE_LOG: { money: 2, xp: 1.5 }
        BIRCH_LOG: { money: 2, xp: 1.5 }
        JUNGLE_LOG: { money: 2.5, xp: 1.8 }
        ACACIA_LOG: { money: 2.5, xp: 1.8 }
        DARK_OAK_LOG: { money: 2.5, xp: 1.8 }
        MANGROVE_LOG: { money: 2.5, xp: 1.8 }
        CHERRY_LOG: { money: 3, xp: 2 }
        CRIMSON_STEM: { money: 3, xp: 2 }
        WARPED_STEM: { money: 3, xp: 2 }

  farmer:
    actions:
      # Crops must grow to their maximum age (which always takes real time) before they pay out,
      # so - unlike miner/digger/woodcutter - a farmer is never checked against the placed-block
      # tracker: replanting is the normal way to earn this money, not an exploit.
      harvest-crop:
        WHEAT: { money: 3, xp: 2 }
        CARROTS: { money: 3, xp: 2 }
        POTATOES: { money: 3, xp: 2 }
        BEETROOTS: { money: 3, xp: 2 }
        NETHER_WART: { money: 4, xp: 2.5 }
        COCOA: { money: 5, xp: 3 }
      harvest-tall-plant:
        MELON: { money: 4, xp: 2 }
        PUMPKIN: { money: 4, xp: 2 }

  builder:
    actions:
      place-block:
        default: { money: 0.15, xp: 0.1 }

  fisherman:
    actions:
      catch-fish:
        COD: { money: 5, xp: 3 }
        SALMON: { money: 6, xp: 3 }
        PUFFERFISH: { money: 8, xp: 4 }
        TROPICAL_FISH: { money: 9, xp: 5 }

  treasurehunter:
    actions:
      catch-treasure:
        default: { money: 40, xp: 25 }

  hunter:
    actions:
      kill-mob:
        ZOMBIE: { money: 4, xp: 3 }
        HUSK: { money: 4, xp: 3 }
        DROWNED: { money: 5, xp: 3 }
        SKELETON: { money: 4, xp: 3 }
        STRAY: { money: 5, xp: 3 }
        SPIDER: { money: 4, xp: 3 }
        CAVE_SPIDER: { money: 5, xp: 3 }
        CREEPER: { money: 6, xp: 4 }
        ENDERMAN: { money: 8, xp: 5 }
        WITCH: { money: 10, xp: 6 }
        PILLAGER: { money: 7, xp: 4 }
        VINDICATOR: { money: 10, xp: 6 }
        RAVAGER: { money: 30, xp: 15 }
        PHANTOM: { money: 8, xp: 5 }
        SLIME: { money: 3, xp: 2 }
        MAGMA_CUBE: { money: 3, xp: 2 }
        BLAZE: { money: 12, xp: 7 }
        GHAST: { money: 15, xp: 8 }
        SHULKER: { money: 20, xp: 10 }
        GUARDIAN: { money: 12, xp: 7 }

  archer:
    actions:
      # Any hostile-mob kill (from hunter's list above) where the fatal blow was a projectile,
      # instead of melee, pays this flat rate on top of - not instead of - the hunter payout.
      kill-mob-ranged:
        default: { money: 6, xp: 4 }

  slayer:
    actions:
      kill-boss:
        ENDER_DRAGON: { money: 5000, xp: 2000 }
        WITHER: { money: 2500, xp: 1000 }
        ELDER_GUARDIAN: { money: 300, xp: 150 }
        WARDEN: { money: 4000, xp: 1800 }

  warrior:
    actions:
      kill-player:
        default: { money: 50, xp: 25 }

  breeder:
    actions:
      breed-entity:
        COW: { money: 8, xp: 5 }
        MUSHROOM_COW: { money: 8, xp: 5 }
        SHEEP: { money: 8, xp: 5 }
        PIG: { money: 8, xp: 5 }
        CHICKEN: { money: 6, xp: 4 }
        RABBIT: { money: 8, xp: 5 }
        HORSE: { money: 15, xp: 8 }
        DONKEY: { money: 12, xp: 7 }
        MULE: { money: 12, xp: 7 }
        LLAMA: { money: 10, xp: 6 }
        WOLF: { money: 10, xp: 6 }
        CAT: { money: 10, xp: 6 }
        TURTLE: { money: 10, xp: 6 }
        BEE: { money: 10, xp: 6 }
        AXOLOTL: { money: 10, xp: 6 }
        default: { money: 8, xp: 5 }

  tamer:
