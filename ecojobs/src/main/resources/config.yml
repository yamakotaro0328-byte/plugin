        CAT: { money: 12, xp: 8 }
        HORSE: { money: 15, xp: 9 }
        DONKEY: { money: 12, xp: 7 }
        PARROT: { money: 10, xp: 6 }
        LLAMA: { money: 12, xp: 7 }
        default: { money: 10, xp: 6 }

  shearer:
    actions:
      shear-entity:
        SHEEP: { money: 3, xp: 2 }
        MUSHROOM_COW: { money: 5, xp: 3 }
        SNOWMAN: { money: 2, xp: 1 }
        default: { money: 3, xp: 2 }

  beekeeper:
    actions:
      harvest-block:
        BEEHIVE: { money: 8, xp: 5 }
        BEE_NEST: { money: 8, xp: 5 }

  enchanter:
    actions:
      # Scaled by the enchant's XP-level cost (a natural difficulty proxy), not a flat rate.
      enchant-item:
        default: { money-per-level: 4, xp-per-level: 3 }

  smelter:
    actions:
      smelt-item:
        IRON_INGOT: { money: 3, xp: 2 }
        GOLD_INGOT: { money: 4, xp: 2.5 }
        COPPER_INGOT: { money: 2, xp: 1.5 }
        GLASS: { money: 1, xp: 0.5 }
        BRICK: { money: 1.5, xp: 1 }
        COOKED_BEEF: { money: 1.5, xp: 1 }
        COOKED_PORKCHOP: { money: 1.5, xp: 1 }
        COOKED_CHICKEN: { money: 1.5, xp: 1 }
        COOKED_MUTTON: { money: 1.5, xp: 1 }
        COOKED_RABBIT: { money: 1.5, xp: 1 }
        COOKED_COD: { money: 1.5, xp: 1 }
        COOKED_SALMON: { money: 1.5, xp: 1 }
        BAKED_POTATO: { money: 1.5, xp: 1 }
        default: { money: 1, xp: 0.5 }

  crafter:
    actions:
      craft-item:
        default: { money: 0.3, xp: 0.2 }

  merchant:
    actions:
      trade-villager:
        default: { money: 8, xp: 5 }

