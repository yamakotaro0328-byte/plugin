name: EcoTP
version: '${project.version}'
main: com.yamakotaro.ecotp.EcoTpPlugin
api-version: '26.2'
author: yamakotaro0328
softdepend: [Vault, PlaceholderAPI]
# Some plugins check for a Vault economy exactly once at their own onEnable and
# never retry (unlike e.g. EvenMoreFish, which retries and succeeds either way).
# If they happen to enable before EcoTP registers its economy with Vault, they
# give up permanently. loadbefore nudges Bukkit's enable order so EcoTP goes
# first for the ones we've actually observed doing this.
# (日本語) 一部のプラグインはVault経済の有無を自身のonEnable時に一度だけ確認し、
# リトライしない (EvenMoreFishはリトライするので影響を受けない)。EcoTPがVaultに
# 経済を登録する前にそれらが先に有効化されてしまうと、以後ずっと「経済プラグインが
# 見つからない」ままになる。loadbefore で、実際にこの問題が確認できたプラグインに
# ついてはEcoTPを先に有効化させる。
loadbefore: [GambleGate, VillagerMarket, Roulette, Gun]

commands:
  home:
    description: Teleport to a saved home (distance-based fee, see config.yml/messages.yml)
    usage: /home [home name]
  sethome:
    description: Set a home at your current location (starts at 1000, +1000 per use)
    usage: /sethome [home name]
  delhome:
    description: Delete one of your homes (free)
    usage: /delhome <home name>
  homes:
    description: List your homes (free)
    usage: /homes
  spawn:
    description: Teleport to the server spawn
    usage: /spawn
  setspawn:
    description: Set the server spawn location (admin, free)
    usage: /setspawn
  tpa:
    description: Request to teleport to a player (you pay)
    usage: /tpa <player>
  tphere:
    description: Request to summon a player to you (cash on delivery, they pay)
    usage: /tphere <player>
  tpaccept:
    description: Accept an incoming teleport request (/tpa or /tphere)
    usage: /tpaccept
  tpdeny:
    description: Deny an incoming teleport request
    usage: /tpdeny
  tpacancel:
    description: Cancel a teleport request you sent
    usage: /tpacancel
  accept:
    description: Confirm or cancel a pending payment (Bedrock-friendly)
    usage: /accept [cancel]
    aliases: [ok]
  balance:
    description: Check your (or another player's) balance
    usage: /balance [player]
    aliases: [bal, money]
  pay:
    description: Send money to another player
    usage: /pay <player> <amount>
  eco:
    description: Modify a player's balance (admin)
    usage: /eco <give|take|set> <player> <amount>
  baltop:
    description: Show the balance leaderboard
    usage: /baltop
  menu:
    description: Open the GUI menu (home/spawn/tpa/tphere/pay/baltop by clicking)
    usage: /menu
    aliases: [ecomenu]
  ecotp:
    description: Reload config.yml and messages.yml (admin)
    usage: /ecotp reload

permissions:
  ecotp.player:
    description: Grants all basic player features (home/sethome/spawn/tpa/tphere/pay/menu)
    default: true
    children:
      ecotp.home: true
      ecotp.sethome: true
      ecotp.spawn: true
      ecotp.tpa: true
      ecotp.tphere: true
      ecotp.pay: true
      ecotp.menu: true
  ecotp.home:
    description: Can use /home, /homes
    default: false
  ecotp.sethome:
    description: Can use /sethome, /delhome
    default: false
  ecotp.spawn:
    description: Can use /spawn
    default: false
  ecotp.setspawn:
    description: Can use /setspawn (admin)
    default: op
  ecotp.tpa:
    description: Can use /tpa
    default: false
  ecotp.tphere:
    description: Can use /tphere
    default: false
  ecotp.balance.others:
    description: Can check other players' balance
    default: op
  ecotp.pay:
    description: Can use /pay
    default: false
  ecotp.admin:
    description: Can use /eco and /ecotp reload
    default: op
  ecotp.menu:
    description: Can use /menu
    default: false
