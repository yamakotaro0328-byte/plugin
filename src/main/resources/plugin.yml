name: EcoTP
version: '${project.version}'
main: com.yamakotaro.ecotp.EcoTpPlugin
api-version: '26.2'
author: yamakotaro0328
softdepend: [Vault, PlaceholderAPI]
# Some plugins check for a Vault economy exactly once at their own onEnable and
# never retry (unlike e.g. EvenMoreFish, which retries and succeeds either way).
# If they happen to enable before EcoTP registers its economy with Vault, they
# give up permanently (GambleGate/VillagerMarket/Roulette/Gun were confirmed
# doing this on a real server log). Bukkit has no "always load first" flag, so
# the only way to influence this is loadbefore naming plugins explicitly — this
# lists every other plugin seen on that server so EcoTP wins the race against
# all of them. Vault/PlaceholderAPI are excluded since softdepend above already
# requires the opposite order for those. A newly installed plugin not in this
# list won't get this guarantee until its name is added here too.
# (日本語) 一部のプラグインはVault経済の有無を自身のonEnable時に一度だけ確認し、
# リトライしない (実サーバーのログでGambleGate/VillagerMarket/Roulette/Gunを確認)。
# Bukkitには「常に最初に読み込む」という汎用フラグが無いため、loadbeforeで
# プラグイン名を明示的に列挙する以外に手段が無い。ここではそのサーバーで確認できた
# 他の全プラグインを列挙し、EcoTPがすべてに先んじて有効化されるようにしている。
# Vault/PlaceholderAPIは上のsoftdependで逆順を要求しているため除外。ここに無い
# 新規プラグインには、名前を追記するまでこの保証は効かない。
loadbefore: [AdvancedBan, ArmorStandTools, Bolt, CMILib, Citizens, DecentHolograms,
  DiscordSRV, EvenMoreFish, GSit, GambleGate, Geyser-Spigot, Gun, ImageFrame,
  ItemEdit, Jobs, Lands, LuckPerms, LunaChat, Maintenance, Multiverse-Core,
  Multiverse-NetherPortals, MyPet, Pl3xMap, PlayerDataSyncReloaded,
  QuickShop-Hikari, ResourcePackManager, Roulette, ServerListPlus, Siboutixesuto,
  Skript, TAB, Train_Carts, UndineMailer, ViaBackwards, ViaRewind, ViaVersion,
  VillagerMarket, Vulcan, WorldEdit, WorldGuard, console, floodgate, ghastmaster,
  packetevents, prism, BKCommonLib, FarmersDelight, Nova, PlugManX, SkBee,
  Veinminer, g]

commands:
  home:
    description: Teleport to a saved home (distance-based fee, see config.yml/messages.yml)
    usage: /home [home name]
  sethome:
    description: Set a home at your current location (starts at 1000, +1000 per use)
    usage: /sethome [home name]
  delhome:
    description: Delete one of your homes (free)
    usage: /delhome <home name>
  homes:
    description: List your homes (free)
    usage: /homes
  spawn:
    description: Teleport to the server spawn
    usage: /spawn
  setspawn:
    description: Set the server spawn location (admin, free)
    usage: /setspawn
  tpa:
    description: Request to teleport to a player (you pay)
    usage: /tpa <player>
  tphere:
    description: Request to summon a player to you (cash on delivery, they pay)
    usage: /tphere <player>
  tpaccept:
    description: Accept an incoming teleport request (/tpa or /tphere)
    usage: /tpaccept
  tpdeny:
    description: Deny an incoming teleport request
    usage: /tpdeny
  tpacancel:
    description: Cancel a teleport request you sent
    usage: /tpacancel
  accept:
    description: Confirm or cancel a pending payment (Bedrock-friendly)
    usage: /accept [cancel]
    aliases: [ok]
  balance:
    description: Check your (or another player's) balance
    usage: /balance [player]
    aliases: [bal, money]
  pay:
    description: Send money to another player
    usage: /pay <player> <amount>
  eco:
    description: Modify a player's balance (admin)
    usage: /eco <give|take|set> <player> <amount>
  baltop:
    description: Show the balance leaderboard
    usage: /baltop
  menu:
    description: Open the GUI menu (home/spawn/tpa/tphere/pay/baltop by clicking)
    usage: /menu
    aliases: [ecomenu]
  ecotp:
    description: Reload config.yml and messages.yml (admin)
    usage: /ecotp reload

permissions:
  ecotp.player:
    description: Grants all basic player features (home/sethome/spawn/tpa/tphere/pay/menu)
    default: true
    children:
      ecotp.home: true
      ecotp.sethome: true
      ecotp.spawn: true
      ecotp.tpa: true
      ecotp.tphere: true
      ecotp.pay: true
      ecotp.menu: true
  ecotp.home:
    description: Can use /home, /homes
    default: false
  ecotp.sethome:
    description: Can use /sethome, /delhome
    default: false
  ecotp.spawn:
    description: Can use /spawn
    default: false
  ecotp.setspawn:
    description: Can use /setspawn (admin)
    default: op
  ecotp.tpa:
    description: Can use /tpa
    default: false
  ecotp.tphere:
    description: Can use /tphere
    default: false
  ecotp.balance.others:
    description: Can check other players' balance
    default: op
  ecotp.pay:
    description: Can use /pay
    default: false
  ecotp.admin:
    description: Can use /eco and /ecotp reload
    default: op
  ecotp.menu:
    description: Can use /menu
    default: false
