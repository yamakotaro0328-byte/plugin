name: EcoTP
version: '${project.version}'
main: com.yamakotaro.ecotp.EcoTpPlugin
api-version: '1.20'
author: yamakotaro0328
softdepend: [Vault, PlaceholderAPI]

commands:
  home:
    description: 保存したホームへテレポートします (距離制、詳細は messages.yml/config.yml 参照)
    usage: /home [ホーム名]
  sethome:
    description: 現在地をホームとして設定します (1000円から、使うたびに1000円ずつ上昇)
    usage: /sethome [ホーム名]
  homes:
    description: 自分のホーム一覧を表示します (無料)
    usage: /homes
  spawn:
    description: スポーン地点へテレポートします
    usage: /spawn
  setspawn:
    description: スポーン地点を設定します (管理者用・無料)
    usage: /setspawn
  tpa:
    description: 指定したプレイヤーのもとへ移動するリクエストを送ります (自分が支払う)
    usage: /tpa <プレイヤー名>
  tphere:
    description: 指定したプレイヤーを自分のもとへ呼び出します (着払い・相手が支払う)
    usage: /tphere <プレイヤー名>
  tpaccept:
    description: 受け取ったテレポートリクエスト (/tpa, /tphere) を承諾します
    usage: /tpaccept
  tpdeny:
    description: 受け取ったテレポートリクエストを拒否します
    usage: /tpdeny
  accept:
    description: 支払いの確認待ちの操作を承諾/キャンセルします (統合版対応)
    usage: /accept [cancel]
    aliases: [ok]
  balance:
    description: 所持金を確認します
    usage: /balance [プレイヤー名]
    aliases: [bal, money]
  pay:
    description: 他のプレイヤーに送金します
    usage: /pay <プレイヤー名> <金額>
  eco:
    description: 所持金を操作します (管理者用)
    usage: /eco <give|take|set> <プレイヤー名> <金額>
  baltop:
    description: 所持金ランキングを表示します
    usage: /baltop
  menu:
    description: GUIメニューを開きます (ホーム/スポーン/tpa/送金/ランキングをクリックで操作)
    usage: /menu
    aliases: [ecomenu]

permissions:
  ecotp.player:
    description: EcoTP の基本プレイヤー機能をすべて使用できる (home/sethome/spawn/tpa/tphere/pay/menu)
    default: true
    children:
      ecotp.home: true
      ecotp.sethome: true
      ecotp.spawn: true
      ecotp.tpa: true
      ecotp.tphere: true
      ecotp.pay: true
      ecotp.menu: true
  ecotp.home:
    description: /home, /homes を使用できる
    default: false
  ecotp.sethome:
    description: /sethome を使用できる
    default: false
  ecotp.spawn:
    description: /spawn を使用できる
    default: false
  ecotp.setspawn:
    description: /setspawn を使用できる (管理者用)
    default: op
  ecotp.tpa:
    description: /tpa を使用できる
    default: false
  ecotp.tphere:
    description: /tphere を使用できる
    default: false
  ecotp.balance.others:
    description: 他のプレイヤーの所持金を確認できる
    default: op
  ecotp.pay:
    description: /pay を使用できる
    default: false
  ecotp.admin:
    description: /eco を使用できる
    default: op
  ecotp.menu:
    description: /menu を使用できる
    default: false
