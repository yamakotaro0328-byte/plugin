name: EcoTP
version: '${project.version}'
main: com.yamakotaro.ecotp.EcoTpPlugin
api-version: '26.2'
author: yamakotaro0328
# Vault is a hard dependency: Bukkit refuses to even load EcoTP if Vault is
# missing, and (since both are default load: POSTWORLD) guarantees Vault's
# onEnable runs, and its Economy service is available, before EcoTP's onEnable
# runs — no race condition, no STARTUP-phase trickery needed. PlaceholderAPI
# stays a soft dependency (genuinely optional; EcoTP works fine without it).
# (日本語) Vault を必須依存にする。Vault が無いサーバーではEcoTPそのものが
# ロードされなくなる代わりに、(両方ともデフォルトの load: POSTWORLD のため)
# VaultのonEnableとEconomyサービスの登録がEcoTPのonEnableより必ず先に完了する
# ことが保証される (競合状態が発生しない。STARTUPのような特殊な仕組みも不要)。
# PlaceholderAPIは本当に任意 (無くてもEcoTPは問題なく動く) なのでsoftdependのまま。
depend: [Vault]
softdepend: [PlaceholderAPI]
# depend: [Vault] only guarantees ordering between EcoTP and Vault itself — it
# says nothing about EcoTP vs. unrelated third-party plugins like GambleGate.
# Some of those check for a Vault economy exactly once at their own onEnable
# and never retry (unlike e.g. EvenMoreFish, which retries and succeeds either
# way). If they happen to enable before EcoTP registers its economy with
# Vault, they give up permanently (GambleGate/VillagerMarket/Roulette/Gun were
# confirmed doing this on a real server log). loadbefore is the only way to
# influence that — this lists every other plugin seen on that server so EcoTP
# wins the race against all of them. Vault/PlaceholderAPI are excluded since
# depend/softdepend above already require the opposite order for those. A
# newly installed plugin not in this list won't get this guarantee until its
# name is added here too.
# (日本語) depend: [Vault] が保証するのはEcoTPとVault自体の順序だけで、GambleGate
# のような無関係な他プラグインとの順序は何も保証しない。一部のプラグインはVault
# 経済の有無を自身のonEnable時に一度だけ確認し、リトライしない (実サーバーの
# ログでGambleGate/VillagerMarket/Roulette/Gunを確認)。これに対処できるのは
# loadbeforeだけなので、そのサーバーで確認できた他の全プラグインを列挙し、EcoTPが
# すべてに先んじて有効化されるようにしている。Vault/PlaceholderAPIは上の
# depend/softdependで逆順を要求しているため除外。ここに無い新規プラグインには、
# 名前を追記するまでこの保証は効かない。
loadbefore: [AdvancedBan, ArmorStandTools, Bolt, CMILib, Citizens, DecentHolograms,
  DiscordSRV, EvenMoreFish, GSit, GambleGate, Geyser-Spigot, Gun, ImageFrame,
  ItemEdit, Jobs, Lands, LuckPerms, LunaChat, Maintenance, Multiverse-Core,
  Multiverse-NetherPortals, MyPet, Pl3xMap, PlayerDataSyncReloaded,
  QuickShop-Hikari, ResourcePackManager, Roulette, ServerListPlus, Siboutixesuto,
  Skript, TAB, Train_Carts, UndineMailer, ViaBackwards, ViaRewind, ViaVersion,
  VillagerMarket, Vulcan, WorldEdit, WorldGuard, console, floodgate, ghastmaster,
  packetevents, prism, BKCommonLib, FarmersDelight, Nova, PlugManX, SkBee,
  Veinminer, g]

commands:
  home:
    description: Teleport to a saved home (distance-based fee, see config.yml/messages.yml)
    usage: /home [home name]
  sethome:
    description: Set a home at your current location (starts at 1000, +1000 per use)
    usage: /sethome [home name]
  delhome:
    description: Delete one of your homes (free)
    usage: /delhome <home name>
  homes:
    description: List your homes (free)
    usage: /homes
  spawn:
    description: Teleport to the server spawn
    usage: /spawn
  setspawn:
    description: Set the server spawn location (admin, free)
    usage: /setspawn
  tpa:
    description: Request to teleport to a player (you pay)
    usage: /tpa <player>
  tphere:
    description: Request to summon a player to you (cash on delivery, they pay)
    usage: /tphere <player>
  tpaccept:
    description: Accept an incoming teleport request (/tpa or /tphere)
    usage: /tpaccept
  tpdeny:
    description: Deny an incoming teleport request
    usage: /tpdeny
  tpacancel:
    description: Cancel a teleport request you sent
    usage: /tpacancel
  accept:
    description: Confirm or cancel a pending payment (Bedrock-friendly)
    usage: /accept [cancel]
    aliases: [ok]
  balance:
    description: Check your (or another player's) balance
    usage: /balance [player]
    aliases: [bal, money]
  pay:
    description: Send money to another player
    usage: /pay <player> <amount>
  eco:
    description: Modify a player's balance (admin)
    usage: /eco <give|take|set> <player> <amount>
  baltop:
    description: Show the balance leaderboard
    usage: /baltop
  menu:
    description: Open the GUI menu (home/spawn/tpa/tphere/pay/baltop by clicking), or
      toggle your own auto-given menu item (compass) on/off
    usage: /menu [item <on|off>]
    aliases: [ecomenu]
  ecotp:
    description: Reload config.yml and messages.yml (admin)
    usage: /ecotp reload
  donate:
    description: Donate money to another player (broadcasts a thank-you message)
    usage: /donate <player> <amount>
  donatemessage:
    description: Set (or reset) your own thank-you message shown when someone donates to you
    usage: /donatemessage <message>|reset
  daily:
    description: Claim your once-per-day reward (streak bonus for consecutive days)
    usage: /daily
  ecoitem:
    description: Give a player a physical, redeemable currency item (admin)
    usage: /ecoitem give <player> <amount> [quantity]

permissions:
  ecotp.player:
    description: Grants all basic player features (home/sethome/spawn/tpa/tphere/pay/menu),
      plus the basic features of companion add-ons (EcoTP-QuickActions' quick menu, weather
      vote, admin shop, and player shop) so a permissions plugin only needs to grant this one
      node for the whole EcoTP family's everyday player features. Bukkit permission "children"
      can reference any plugin's node by name, not just this plugin's own, which is what makes
      this bundling possible even though ecotpqa.* is declared by a separate plugin
      (EcoTP-QuickActions/addon-quickactions).
    default: true
    children:
      ecotp.home: true
      ecotp.sethome: true
      ecotp.spawn: true
      ecotp.tpa: true
      ecotp.tphere: true
      ecotp.pay: true
      ecotp.menu: true
      ecotp.donate: true
      ecotp.daily: true
      ecotp.baltop: true
      ecotpqa.quickmenu: true
      ecotpqa.weathervote: true
      ecotpqa.adminshop: true
      ecotpqa.playershop: true
  ecotp.home:
    description: Can use /home, /homes
    default: false
  ecotp.sethome:
    description: Can use /sethome, /delhome
    default: false
  ecotp.spawn:
    description: Can use /spawn
    default: false
  ecotp.setspawn:
    description: Can use /setspawn (admin)
    default: op
  ecotp.tpa:
    description: Can use /tpa
    default: false
  ecotp.tphere:
    description: Can use /tphere
    default: false
  ecotp.balance.others:
    description: Can check other players' balance
    default: op
  ecotp.pay:
    description: Can use /pay
    default: false
  ecotp.admin:
    description: Can use /eco and /ecotp reload
    default: op
  ecotp.menu:
    description: Can use /menu
    default: false
  ecotp.donate:
    description: Can use /donate and /donatemessage
    default: false
  ecotp.daily:
    description: Can use /daily
    default: false
  ecotp.baltop:
    description: Can use /baltop
    default: false
  ecotp.ecoitem:
    description: Can use /ecoitem give (admin)
    default: op
