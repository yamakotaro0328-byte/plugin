# EcoTP 設定ファイル
# このプラグインは独自の経済システムを内蔵しているため、Essentials 等の
# 経済プラグインが無くても動作します。Vault はオプションで、導入されていれば
# 他のプラグイン (ショップ等) にもこの経済を公開します。

# チャットに表示する接頭辞 (& でカラーコード使用可)
prefix: "&8[&6EcoTP&8]&r "

# 新規プレイヤーの初期所持金 (Essentials のデータが見つかった場合はそちらを優先する)
starting-balance: 0.0

essentials-import:
  # 有効にすると、初めて見るプレイヤーの所持金を
  # plugins/Essentials/userdata/<uuid>.yml から一度だけ引き継ぐ
  enabled: true

# 料金設定
costs:
  # /home 1回あたりの料金
  home: 100.0
  # /sethome の初回料金。以降 sethome-increment ずつ加算されていく
  sethome-base: 1000.0
  sethome-increment: 1000.0
  # /spawn 1回あたりの料金
  spawn: 100.0
  # /tp, /tpa の1ブロックあたりの料金
  tp-per-block: 1.0
  tpa-per-block: 1.0
  # /tp, /tpa で対象プレイヤーが別ワールドにいる場合の固定料金
  cross-world-flat-cost: 500.0

# 支払い確認 (チャットクリック / 統合版用 /accept コマンド) のタイムアウト秒数
confirmation-timeout-seconds: 30

# /tpa リクエスト自体 (相手の承諾待ち) のタイムアウト秒数
tpa-request-timeout-seconds: 60

# ワープ実行前の詠唱時間。支払いはこの待機が完了してから行われる。
# 移動やダメージでキャンセルされた場合は課金されない (戦闘中の逃げテレポ対策)。
warmup:
  enabled: true
  seconds: 3
  cancel-on-move: true
  cancel-on-damage: true

# 残高の保存先。yaml (デフォルト、追加設定不要) か mysql を選べる。
# 複数サーバーで残高を共有したい場合は mysql を使う。
storage:
  type: yaml
  mysql:
    host: localhost
    port: 3306
    database: ecotp
    username: root
    password: ""
    table-prefix: "ecotp_"

# /baltop で表示する人数
baltop-limit: 10
