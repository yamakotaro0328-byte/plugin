# EcoTP configuration
# This plugin has its own built-in economy, so it works without Essentials or
# any other economy plugin. Vault is required (it's how this economy is
# exposed to other plugins, e.g. shops) — install it alongside EcoTP.
# (日本語) このプラグインは独自の経済システムを内蔵しているため、Essentials 等の
# 経済プラグインが無くても動作します。Vault は必須です (この経済を他のプラグイン
# (ショップ等) に公開するために使われます)。EcoTPと一緒に導入してください。

# Language for messages.yml: "en" or "ja".
# Used the first time messages.yml is generated, and also whenever you change
# this value afterwards and run /ecotp reload (or restart) — messages.yml is
# then regenerated from the bundled template for that language, overwriting
# any custom edits. As long as you leave this unchanged, messages.yml keeps
# whatever you've edited into it.
# (日本語) messages.yml の言語。"en" または "ja"。
# 初回生成時だけでなく、後からこの値を変更して /ecotp reload (または再起動) すると、
# その言語の同梱テンプレートで messages.yml が再生成されます (それまでの編集内容は
# 上書きされます)。この値を変えない限り、messages.yml の編集内容はそのまま残ります。
language: en

# Chat prefix (supports & color codes).
# (日本語) チャットに表示する接頭辞 (& でカラーコード使用可)
prefix: "&8[&6EcoTP&8]&r "

economy:
  # If true (default), this plugin manages balances itself — no Essentials or
  # other economy plugin required. If false, it instead fetches an Economy
  # from Vault (so you can keep using Essentials/another economy plugin);
  # in that case Vault AND another economy plugin must be installed, and
  # /baltop is unavailable (Vault has no "list all balances" API).
  # (日本語) true (デフォルト) なら独自の経済システムを使用 (Essentials 不要)。
  # false にすると Vault 経由で他の経済プラグインを使う (Vault と経済プラグインの
  # 両方が必要。/baltop は使用不可)。
  enabled: true

# Toggle individual player-facing features on/off. All default to true.
# (日本語) 各機能を個別にオン/オフできます。デフォルトはすべて true。
features:
  home: true
  sethome: true
  spawn: true
  tpa: true
  tphere: true
  pay: true
  baltop: true
  menu: true
  donate: true
  daily: true
  eco-item: true

# /daily: a once-per-day claim. Claiming again within streak-window-hours of the last
# claim increases your streak (capped at max-streak-bonus-days), which raises the reward;
# missing that window resets the streak back to day 1.
# reward = base-amount + min(streak - 1, max-streak-bonus-days) * streak-bonus-per-day
# (日本語) /daily: 1日1回受け取れるボーナス。streak-window-hours以内に次回請求すると
# 連続日数(streak、上限max-streak-bonus-days)が伸びて報酬が増え、それを過ぎると
# streakは1日目にリセットされる。
# 報酬 = base-amount + min(streak - 1, max-streak-bonus-days) * streak-bonus-per-day
daily-reward:
  base-amount: 100.0
  streak-bonus-per-day: 20.0
  max-streak-bonus-days: 30
  cooldown-hours: 24
  streak-window-hours: 48

# /ecoitem give <player> <amount> [quantity] (admin): spawns a physical, tradeable
# currency item worth <amount> each. Anyone holding one can right-click to redeem their
# whole stack's value at once (see EcoItemManager/EcoItemListener) - no permission needed
# to redeem, only to give.
# (日本語) /ecoitem give <プレイヤー名> <金額> [個数] (管理者用): 右クリックで換金できる、
# 取引可能な「物理通貨」アイテムを生成して渡す。誰でも持っていれば右クリックで
# スタック全体の合計額を一度に換金できる(換金自体に権限は不要、付与にのみ必要)。
eco-item:
  material: GOLD_NUGGET

# Broadcasts a thank-you message server-wide whenever /donate succeeds. Recipients can
# personalize their own message with /donatemessage (placeholders: {player}, {amount}).
# (日本語) /donate が成功するたびにサーバー全体へお礼メッセージを流す。受け取った本人は
# /donatemessage で自分専用の文言に変更できる(使えるプレースホルダー: {player}, {amount})。

# Rewards a player for voting on a voting site. If the player is offline when the vote
# arrives, the reward is queued and given the next time they join.
# (日本語) 投票サイトでの投票報酬。投票時にオフラインだった場合は保留され、
# 次回ログイン時に付与される。
vote-reward:
  enabled: true
  amount: 1000.0

# EcoTP includes its OWN Votifier(V1)-protocol-compatible listener, so voting sites can
# point directly at this server WITHOUT installing NuVotifier or any other vote plugin —
# just start the server once, then give your voting sites the contents of
# plugins/EcoTP/votifier-rsa/public.key (generated automatically on first run) and this
# host:port. If you'd rather keep using an existing NuVotifier install instead (e.g. it's
# already shared with other plugins), set enabled: false here; EcoTP will still pick up
# NuVotifier's own vote events automatically via vote-reward above.
# (日本語) EcoTPはVotifier(V1)プロトコル互換のリスナーを自前で内蔵しているため、
# NuVotifier等を別途導入しなくても投票サイトから直接この設定を使えます。初回起動時に
# 自動生成される plugins/EcoTP/votifier-rsa/public.key の中身と、このhost:portを
# 投票サイト側に設定してください。既存のNuVotifierをそのまま使いたい場合はここを
# enabled: falseにすれば、NuVotifierの投票イベントを自動検出する形で動作します
# (上のvote-rewardの設定はどちらの方式でも共通で使われます)。
votifier:
  enabled: true
  # "0.0.0.0" listens on every network interface. Change only if you know you need to.
  # (日本語) "0.0.0.0" は全てのネットワークインターフェースで待ち受ける。理由がなければ変更不要。
  host: "0.0.0.0"
  # Default Votifier port. Change this (and tell your voting sites) if it conflicts with
  # something else already using 8192, such as an existing NuVotifier install.
  # (日本語) Votifierの標準ポート。既にNuVotifier等が8192を使っている場合は変更し、
  # 投票サイト側にもそのポート番号を伝えること。
  port: 8192

# Starting balance for new players (used only when economy.enabled: true and
# no matching Essentials data was found — see essentials-import below).
# (日本語) 新規プレイヤーの初期所持金 (Essentials のデータが見つかった場合はそちらを優先)
starting-balance: 0.0

essentials-import:
  # If true, the first time a player is seen, their balance is imported once
  # from plugins/Essentials/userdata/<uuid>.yml (only used when
  # economy.enabled: true).
  # (日本語) 有効にすると、初めて見るプレイヤーの所持金を
  # plugins/Essentials/userdata/<uuid>.yml から一度だけ引き継ぐ
  enabled: true

# Prices. (日本語) 料金設定
costs:
  # First /sethome fee; increases by sethome-increment on every later use.
  # (日本語) /sethome の初回料金。以降 sethome-increment ずつ加算されていく
  sethome-base: 1000.0
  sethome-increment: 1000.0
  # Teleport fee for /home, /spawn, /tpa, /tphere:
  # fee = max(distance-min-fee, ceil(3D straight-line distance / distance-blocks-per-yen))
  # (default: 1 currency unit per 10 blocks, minimum 100 — the fee starts growing
  # past the minimum once you're over 1000 blocks away)
  # (日本語) /home, /spawn, /tpa, /tphere のテレポート料金:
  # 料金 = max(distance-min-fee, ceil(3次元の直線距離 ÷ distance-blocks-per-yen))
  # (デフォルト: 10ブロックにつき1、最低100 — 1000ブロックを超えたあたりから
  # 最低料金より増え始めます)
  distance-min-fee: 100.0
  distance-blocks-per-yen: 10.0

# Timeout (seconds) for payment confirmation (chat button / re-running the
# same command / /accept, /ok).
# (日本語) 支払い確認 (チャットクリック / 同じコマンドの再実行 / /accept, /ok) のタイムアウト秒数
confirmation-timeout-seconds: 30

# Timeout (seconds) for /tpa, /tphere requests themselves (waiting on the
# other player to respond).
# (日本語) /tpa, /tphere リクエスト自体 (相手の承諾待ち) のタイムアウト秒数
tpa-request-timeout-seconds: 60

# Safety checks and cast time before teleporting via /home, /spawn, /tpa,
# /tphere. Payment only happens after this completes, so a cancelled
# teleport is never charged.
# (日本語) /home, /spawn, /tpa, /tphere でテレポートする前の安全確認・詠唱時間。
# 支払いはこの待機が完了してから行われるため、キャンセルされた場合は課金されない。
teleport-safety:
  # Seconds the player must stand still at the starting location.
  # (日本語) 開始地点から動かずに待つ秒数
  countdown-seconds: 5
  # Movement tolerance (blocks) before it counts as "moved". Looking around
  # alone does not cancel the countdown.
  # (日本語) 「動いた」と判定するまでの許容範囲 (ブロック)。視点移動だけでは反応しない。
  movement-tolerance: 0.2
  # Teleporting is blocked/cancelled if a hostile mob is within this radius
  # (blocks). Set to 0 to disable this check.
  # (日本語) この半径 (ブロック) 以内に敵対Mobがいるとテレポートできない/キャンセルされる (0で無効)
  hostile-mob-radius: 10.0
  # Teleporting is blocked for this many seconds after any player-vs-player
  # combat. Set to 0 to disable this check.
  # (日本語) 直近にプレイヤー同士の戦闘があってからこの秒数はテレポートできない (0で無効)
  pvp-cooldown-seconds: 15
  # Show a boss bar with a countdown while waiting.
  # (日本語) 詠唱中にボスバーでカウントダウンを表示する
  show-bossbar: true
  # Play a sound/particle effect when a teleport completes successfully.
  # (日本語) テレポート成功時に効果音とパーティクルを再生する
  play-effects: true

# Maximum number of homes each player may set.
# (日本語) プレイヤーごとに設定できるホームの上限数
homes:
  max-per-player: 3

# Where balances/homes are stored: "yaml" (default, no extra setup) or
# "mysql" (share them across multiple servers).
# (日本語) 残高・ホームの保存先。yaml (デフォルト、追加設定不要) か mysql を選べる。
# 複数サーバーで共有したい場合は mysql を使う。
storage:
  type: yaml
  mysql:
    host: localhost
    port: 3306
    database: ecotp
    username: root
    password: ""
    table-prefix: "ecotp_"

# Number of players shown by /baltop.
# (日本語) /baltop で表示する人数
baltop-limit: 10
