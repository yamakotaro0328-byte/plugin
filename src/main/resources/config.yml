# EcoTP 設定ファイル
# このプラグインは独自の経済システムを内蔵しているため、Essentials 等の
# 経済プラグインが無くても動作します。Vault はオプションで、導入されていれば
# 他のプラグイン (ショップ等) にもこの経済を公開します。

# チャットに表示する接頭辞 (& でカラーコード使用可)
prefix: "&8[&6EcoTP&8]&r "

# 新規プレイヤーの初期所持金 (Essentials のデータが見つかった場合はそちらを優先する)
starting-balance: 0.0

essentials-import:
  # 有効にすると、初めて見るプレイヤーの所持金を
  # plugins/Essentials/userdata/<uuid>.yml から一度だけ引き継ぐ
  enabled: true

# 料金設定
costs:
  # /sethome の初回料金。以降 sethome-increment ずつ加算されていく
  sethome-base: 1000.0
  sethome-increment: 1000.0
  # /home, /spawn, /tpa, /tphere のテレポート料金:
  # 料金 = max(distance-min-fee, ceil(3次元の直線距離 ÷ distance-blocks-per-yen))
  # (デフォルト: 100ブロックにつき1円、最低100円)
  distance-min-fee: 100.0
  distance-blocks-per-yen: 100.0

# 支払い確認 (チャットクリック / 同じコマンドの再実行 / /accept, /ok コマンド) のタイムアウト秒数
confirmation-timeout-seconds: 30

# /tpa, /tphere リクエスト自体 (相手の承諾待ち) のタイムアウト秒数
tpa-request-timeout-seconds: 60

# /home, /spawn, /tpa, /tphere でテレポートする前の安全確認・詠唱時間。
# 支払いはこの待機が完了してから行われるため、キャンセルされた場合は課金されない。
teleport-safety:
  # 開始地点から動かずに待つ秒数
  countdown-seconds: 5
  # 「動いた」と判定するまでの許容範囲 (ブロック)。視点移動だけでは反応しない。
  movement-tolerance: 0.2
  # この半径 (ブロック) 以内に敵対Mobがいるとテレポートできない/キャンセルされる
  hostile-mob-radius: 10.0
  # 直近にプレイヤー同士の戦闘があってからこの秒数はテレポートできない
  pvp-cooldown-seconds: 15

# プレイヤーごとに設定できるホームの上限数
homes:
  max-per-player: 3

# 残高の保存先。yaml (デフォルト、追加設定不要) か mysql を選べる。
# 複数サーバーで残高を共有したい場合は mysql を使う。
storage:
  type: yaml
  mysql:
    host: localhost
    port: 3306
    database: ecotp
    username: root
    password: ""
    table-prefix: "ecotp_"

# /baltop で表示する人数
baltop-limit: 10
