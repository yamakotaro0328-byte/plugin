sethome:
  description: "現在地をホーム「{name}」に設定します"
  success: "&aホーム「{name}」を設定しました。({cost} 支払いました)"
  invalid-name: "&cホーム名は英数字・日本語のみ、16文字以内で指定してください。"
  limit-reached: "&cホームの上限 ({max}個) に達しています。既存のホームを上書きしてください。"

homes:
  empty: "&cまだホームが設定されていません。/sethome で設定できます。"
  list: "&aあなたのホーム: &f{names}"

delhome:
  usage: "&c使い方: /delhome <名前>"
  not-found: "&cホーム「{name}」が見つかりません。"
  success: "&aホーム「{name}」を削除しました。"

spawn:
