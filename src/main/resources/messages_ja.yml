# EcoTP メッセージ設定ファイル (日本語)
# {placeholder} の部分は実行時に値へ置き換わります。& でカラーコードが使えます (&a, &c, &l など)。
# ここを書き換えるだけで、コードを触らずに文言や通貨単位を変更できます。

currency:
  singular: "円"
  plural: "円"
  format: "{amount}{unit}"

general:
  players-only: "&cプレイヤーのみ実行できます。"
  no-permission: "&cこのコマンドを使う権限がありません。"
  insufficient-funds: "&c所持金が不足しています。(必要: {cost})"
  player-offline: "&cそのプレイヤーはオンラインではありません。"
