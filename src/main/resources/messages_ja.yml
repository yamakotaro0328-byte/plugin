  none-to-deny: "&c拒否できるテレポートリクエストはありません。"
  requester-offline: "&cリクエストを送った {player} はオフラインになりました。"
  insufficient-funds-target: "&c{player} の所持金が不足しているためテレポートできませんでした。(必要: {cost})"
  insufficient-funds-requester: "&c所持金が不足しているため {player} へテレポートできませんでした。(必要: {cost})"
  timeout-target: "&cテレポートリクエストがタイムアウトしました。"
