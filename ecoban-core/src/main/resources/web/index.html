<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoBan Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%235b8def'/%3E%3Cpath d='M7 7l10 10M17 7L7 17' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header>
  <div class="brand">
    <svg class="brand-icon" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
      <circle cx="12" cy="12" r="10" fill="var(--accent)"/>
      <path d="M7 7l10 10M17 7L7 17" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <h1>EcoBan</h1>
  </div>
  <div id="auth-area">
    <button id="login-button">Log in</button>
    <button id="logout-button" class="ghost" hidden>Log out</button>
  </div>
</header>

<div id="login-overlay" class="overlay" hidden>
  <form id="login-form" class="modal-card">
    <h2>Sign in</h2>
    <label>Username<input type="text" id="login-username" autocomplete="username" required></label>
    <label>Password<input type="password" id="login-password" autocomplete="current-password" required></label>
    <div class="modal-actions">
      <button type="button" id="login-cancel" class="ghost">Cancel</button>
      <button type="submit">Sign in</button>
    </div>
    <p id="login-error" class="error" hidden></p>
  </form>
</div>

<div id="lift-overlay" class="overlay" hidden>
  <form id="lift-form" class="modal-card">
    <h2>Lift punishment</h2>
    <p class="modal-subtitle" id="lift-summary"></p>
    <label>Reason (optional)<input type="text" id="lift-reason" placeholder="e.g. appealed, mistake"></label>
    <div class="modal-actions">
      <button type="button" id="lift-cancel" class="ghost">Cancel</button>
      <button type="submit" class="danger">Lift punishment</button>
    </div>
  </form>
</div>

<main>
  <section class="stats-row" id="stats-row" aria-label="Punishment summary">
    <div class="stat-tile">
      <span class="stat-value" id="stat-total">–</span>
      <span class="stat-label">Active total</span>
    </div>
    <div class="stat-tile">
      <span class="stat-value" id="stat-bans">–</span>
      <span class="stat-label">Bans</span>
    </div>
    <div class="stat-tile">
      <span class="stat-value" id="stat-mutes">–</span>
      <span class="stat-label">Mutes</span>
    </div>
    <div class="stat-tile">
      <span class="stat-value" id="stat-warns">–</span>
      <span class="stat-label">Warnings</span>
    </div>
  </section>

  <section class="card" id="issue-card" hidden>
    <h2>Issue a punishment</h2>
    <form id="issue-form" class="issue-form">
      <select id="issue-type">
        <option value="ban">Ban</option>
        <option value="ipban">IP Ban</option>
        <option value="mute">Mute</option>
        <option value="kick">Kick</option>
        <option value="warn">Warn</option>
      </select>
      <input type="text" id="issue-uuid" placeholder="Player UUID">
      <input type="text" id="issue-name" placeholder="Player name (optional)">
      <input type="text" id="issue-ip" placeholder="IP address (IP Ban only)" hidden>
      <div class="duration-group">
        <input type="number" id="issue-duration" placeholder="Duration (blank = permanent)" min="0">
        <select id="issue-duration-unit">
          <option value="minutes">Minutes</option>
          <option value="hours">Hours</option>
          <option value="days" selected>Days</option>
          <option value="weeks">Weeks</option>
        </select>
      </div>
      <input type="text" id="issue-reason" placeholder="Reason" class="wide">
      <button type="submit">Issue</button>
    </form>
    <p id="issue-result" class="result"></p>
  </section>

  <section class="card">
    <div class="card-heading">
      <h2>Punishments</h2>
      <span class="spinner" id="table-spinner" hidden aria-label="Loading"></span>
    </div>
    <div class="toolbar">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M20 20l-4.5-4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="text" id="search-input" placeholder="Search by name or IP...">
      </div>
      <select id="type-filter">
        <option value="">All active types</option>
        <option value="BAN">Ban</option>
        <option value="TEMPBAN">Temp Ban</option>
        <option value="IPBAN">IP Ban</option>
        <option value="MUTE">Mute</option>
        <option value="TEMPMUTE">Temp Mute</option>
        <option value="KICK">Kick</option>
        <option value="WARN">Warn</option>
      </select>
      <button id="refresh-button" class="ghost">Refresh</button>
    </div>
    <div class="table-wrap">
      <table id="punishments-table">
        <thead>
          <tr>
            <th>Type</th>
            <th>Target</th>
            <th>Reason</th>
            <th>Operator</th>
            <th>Issued</th>
            <th>Expires</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="punishments-body"></tbody>
      </table>
      <p class="empty-state" id="empty-state" hidden>No punishments match here.</p>
      <p class="truncation-hint" id="truncation-hint" hidden>Showing the first 100 results - narrow your search to see more.</p>
    </div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
